<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 多層防御(第零条実践規範§7-4): 出口封鎖CSP。Hissuru と同一（GAS も accounts/googleusercontent も同ホスト）。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://accounts.google.com https://apis.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>部門損益 可視化</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{ --border:#e2e8f0; --muted:#64748b; --fg:#0f172a; --sky50:#f0f9ff; --sky100:#e0f2fe; --sky700:#0369a1; --sky800:#075985; --amber:#b45309;
         /* オリジナル(DeptProfitVis charts.py)準拠の配色 */
         --sales:#1f77b4; --gp:#ff7f0e; --rate:#d62728; --salesL:#a6c8e0; --gpL:#ffcc80; --rateL:#e57373;
         --waste:#d62728; --discount:#C71585; --loss:#FFAB00; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:var(--fg);background:#fff;}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;}
  header .logo{background:#f39800;color:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:5px 7px;}
  header h1{font-size:15px;margin:0;} header .sub{font-size:11px;color:var(--muted);font-weight:400;}
  header .user{margin-left:auto;font-size:11px;color:var(--muted);}
  /* 窓口の版は PC のヘッダで見る（スマホではヘッダを高くしない＝前の版と同じ高さ） */
  @media (max-width:760px){ #apiBuild{display:none;} }
  header .ghelp{margin-left:10px;padding:4px 10px;font-size:12px;white-space:nowrap;border:1px solid var(--sky700);border-radius:8px;color:var(--sky800);background:var(--sky50);font-weight:600;cursor:pointer;}
  .page{min-height:calc(100vh - 55px);}
  main{max-width:1160px;margin:0 auto;padding:18px 16px 40px;}
  h2.title{font-size:20px;font-weight:600;margin:0;} .subtitle{font-size:13px;color:var(--muted);margin:2px 0 0;}
  .btn{border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;padding:6px 12px;color:#334155;}
  .btn.primary{background:#f39800;border-color:#f39800;color:#fff;font-weight:600;}
  select{font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;}
  .lb{font-size:11px;color:var(--muted);}
  .note{color:var(--muted);font-size:13px;padding:14px;}
  .err{color:#b91c1c;font-size:13px;padding:14px;border:1px solid #fecaca;border-radius:10px;background:#fef2f2;white-space:pre-wrap;}
  /* 表示できない時の原因カード（エラーが起きた画面にだけ出す・確認コードで管理者へ連絡できるように） */
  .alertcard{border:1px solid #fecaca;background:#fef2f2;color:#7f1d1d;border-radius:12px;padding:12px 16px;margin:8px 0;font-size:13px;line-height:1.75;}
  .alertcard.warn{border-color:#fde68a;background:#fffbeb;color:#78350f;}
  .alertcard.info{border-color:#bae6fd;background:var(--sky50);color:var(--sky800);}
  .alertcard .t{display:block;font-size:14px;font-weight:700;margin-bottom:2px;}
  .alertcard .code{display:inline-block;font-family:Consolas,"Courier New",monospace;font-weight:700;background:#fff;border:1px solid currentColor;border-radius:6px;padding:0 7px;user-select:all;}
  .alertcard .howto{font-size:12px;margin-top:4px;}
  .alertcard .btn{margin-top:6px;}
  .card{border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:22px;max-width:520px;margin:6vh auto 0;text-align:center;}
  .card .cico{font-size:30px;} .card h3{margin:8px 0 4px;font-size:17px;} .card p{color:var(--muted);font-size:13px;margin:6px 0 16px;}
  .roadmap{border:1px solid var(--sky100);background:var(--sky50);border-radius:12px;padding:14px 18px;margin-top:16px;text-align:left;}
  .roadmap b{color:var(--sky800);} .roadmap ul{margin:8px 0 0 18px;padding:0;} .roadmap li{font-size:13px;line-height:1.8;color:#334155;}
  .badge{display:inline-block;background:#fffbeb;border:1px solid #fde68a;color:var(--amber);font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;}
  .selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0 6px;}
  .modeseg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .modeseg button{border:none;background:#fff;padding:6px 12px;font-size:13px;cursor:pointer;color:#334155;}
  .modeseg button.on{background:#f39800;color:#fff;font-weight:600;}
  .wcard{border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:20px 22px;margin-top:14px;}
  .wq{margin:10px 0 16px;} .wqt{font-size:14px;font-weight:700;margin-bottom:8px;color:#0f172a;}
  .wopts{display:flex;flex-wrap:wrap;gap:8px;}
  .wbtn{border:1.5px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-size:13.5px;padding:9px 14px;color:#334155;}
  .wbtn:hover{border-color:#f39800;background:#fff7ed;}
  .wbtn.on{border-color:#f39800;background:#f39800;color:#fff;font-weight:700;}
  .chartcard{border:1px solid var(--border);border-radius:12px;background:#fff;padding:12px 14px;margin-top:8px;}
  .chartcard .chead{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .chartcard .chead b{font-size:14px;} .chartcard .chead .lb{font-size:11px;}
  .scopechips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 0;}
  .chip{font-size:11px;border-radius:999px;padding:2px 9px;background:#eef2f7;color:#475569;}
  .chip.a{background:#e0f2fe;color:#075985;} .chip.s{background:#dcfce7;color:#166534;} .chip.d{background:#ede9fe;color:#5b21b6;}
  svg text{font-family:"Segoe UI","Hiragino Sans",sans-serif;}
  .admin-btn{border:1px solid #f59e0b;background:#fffbeb;color:#92400e;font-weight:700;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}
  #busyOverlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center;z-index:200;}
  #busyOverlay .bcard{background:#fff;border-radius:14px;padding:18px 24px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center;min-width:240px;}
  #busyOverlay .bttl{font-weight:700;font-size:14px;margin-top:10px;color:#0f172a;} #busyOverlay .bsub{font-size:12px;color:var(--muted);margin-top:4px;}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid #e2e8f0;border-top-color:#f39800;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* ── 部門損益利用ガイド（全システム共通の型: 左に目次・右に本文・双方向に連動）。節ごとに、まず図（写真に番号の丸／流れの箱）。文は図の補い ──
     本文の言葉は窓口（Guide.gs）がログインした人にだけ返す。写真と丸の位置は guide-img/figs.js（tests/guide_shots.js が作る）。
     scroll-behavior:smooth は付けない（コンテナに付けるとプログラム的スクロールが効かない環境がある）。移動は JS で滑らせる */
  #guide{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px;}
  #guide .gcard{background:#fff;border-radius:14px;width:100%;max-width:1200px;height:94vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.28);overflow:hidden;}
  #guide .ghead{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:10px 16px;border-bottom:1px solid var(--border);flex:none;}
  #guide .ghead h2{font-size:16px;margin:0;white-space:nowrap;}
  #guide .gfor{display:inline-flex;gap:2px;padding:2px;border-radius:9px;background:#f1f5f9;border:1px solid var(--border);}
  #guide .gfor button{border:0;background:none;padding:4px 12px;border-radius:7px;font-size:13px;font-weight:600;color:#475569;cursor:pointer;white-space:nowrap;}
  #guide .gfor button.on{background:#f39800;color:#fff;}
  #guide .gmove{display:inline-flex;gap:6px;margin-left:auto;}
  #guide .gmove .btn{padding:4px 10px;font-size:12.5px;white-space:nowrap;}
  #guide .gmove .btn:disabled{opacity:.45;cursor:default;}
  #guide .gwrap{display:flex;min-height:0;flex:1;}
  #guide .gnav{width:236px;flex:none;border-right:1px solid var(--border);background:#f8fafc;overflow:auto;padding:10px 0 18px;}
  #guide .gnav a{display:block;padding:7px 14px 7px 16px;font-size:13px;line-height:1.5;color:#475569;text-decoration:none;border-left:3px solid transparent;}
  #guide .gnav a:hover{background:#eef2f7;color:var(--sky800);}
  #guide .gnav a.on{background:#e0f2fe;color:var(--sky800);font-weight:700;border-left-color:var(--sky700);}
  #guide .gbody{flex:1;min-width:0;overflow:auto;padding:6px 24px 48px;}
  #guide .gsec{border-top:1px solid var(--border);padding:14px 0 18px;scroll-margin-top:8px;content-visibility:auto;contain-intrinsic-size:auto 560px;}   /* 画面の外の節は描かない（開く速さ）。印刷では全部描く */
  #guide .gsec:first-child{border-top:0;}
  #guide .gsec h3{font-size:17px;margin:0 0 10px;color:#0f172a;display:flex;align-items:center;gap:8px;}
  #guide .gsec h3::before{content:attr(data-n);display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:7px;background:var(--sky700);color:#fff;font-size:14px;}
  #guide .gsec.landing{animation:gland 1.6s ease-out;}
  @keyframes gland{from{background:#e0f2fe;}to{background:transparent;}}
  #guide .gnum{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#c2410c;color:#fff;font-weight:800;font-size:14px;line-height:1;box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.35);flex:none;}
  #guide .gpair{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:flex-start;}
  #guide .gshot{margin:0;flex:1 1 100%;min-width:0;}
  #guide .gpair.side .gshot{flex:0 1 calc(var(--gw) + 28px);max-width:62%;}
  #guide .gshot-scroll{overflow-x:auto;padding:12px;background:#eef1f5;border-radius:10px;}
  #guide .gshot-frame{position:relative;width:100%;max-width:var(--gw,100%);margin:0 auto;container-type:inline-size;}
  #guide .gshot-frame img{display:block;width:100%;height:auto;border:1px solid #cbd5e1;border-radius:4px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);}
  #guide .gshot.zoom .gshot-frame{width:var(--gw);max-width:none;}
  #guide .gshot-frame .gmark{position:absolute;transform:translate(-50%,-50%);z-index:2;transition:transform .12s;width:clamp(17px,2.3cqw,24px);height:clamp(17px,2.3cqw,24px);font-size:clamp(11px,1.3cqw,14px);}
  #guide .gshot-frame .gmark.hot{transform:translate(-50%,-50%) scale(1.3);background:#9a3412;}
  #guide .gbox{position:absolute;z-index:1;border:3px solid #c2410c;border-radius:5px;background:rgba(194,65,12,.08);opacity:0;transition:opacity .12s;pointer-events:none;}
  #guide .gbox.hot{opacity:1;}
  #guide .gcap{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:4px;}
  #guide .gsteps{list-style:none;margin:0;padding:0;flex:1 1 280px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 18px;align-content:start;}
  #guide .gpair.side .gsteps{grid-template-columns:minmax(0,1fr);}
  #guide .gsteps li{position:relative;padding:5px 8px 5px 38px;border-radius:7px;font-size:14px;line-height:1.5;color:#475569;margin:0;}
  #guide .gsteps li .gnum{position:absolute;left:6px;top:5px;}
  #guide .gsteps li strong{color:#0f172a;font-size:15px;margin-right:6px;}
  #guide .gsteps li.hot{background:#fff1e6;}
  #guide .gnotes{margin:12px 0 0;padding-left:1.3em;}
  #guide .gnotes li{margin:0 0 4px;font-size:14.5px;line-height:1.7;color:#334155;}
  #guide .gflow-list{list-style:none;margin:0;padding:6px 0 0 10px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:stretch;}
  #guide .gflow-step{position:relative;flex:1 1 180px;max-width:300px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px 12px 12px;border:1px solid #bcd3e6;border-radius:10px;background:#f6f9fc;margin:0;}
  #guide .gflow-step>.gnum{position:absolute;top:-10px;left:-10px;}
  #guide .gflow:not(.gcards) .gflow-step:not(:last-child)::after{content:"→";position:absolute;right:-26px;top:50%;transform:translateY(-50%);font-size:20px;font-weight:700;color:#475569;}
  #guide .gflow-step strong{font-size:15px;color:#0f172a;}
  #guide .gflow-t{font-size:13.5px;color:#475569;line-height:1.5;}
  #guide .gflow-ui{display:flex;align-items:center;min-height:38px;}
  #guide .gcards .gflow-step{max-width:360px;}
  #guide .gui-btn{display:inline-block;border:1px solid var(--border);border-radius:8px;background:#fff;font-size:13px;padding:5px 12px;color:#334155;white-space:nowrap;}
  #guide .gui-btn.primary{background:#f39800;border-color:#f39800;color:#fff;font-weight:600;}
  #guide .gui-acct{display:inline-flex;align-items:center;gap:8px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:5px 10px;font-size:13px;}
  #guide .gui-acct i{width:22px;height:22px;border-radius:50%;background:#64748b;display:inline-block;}
  #guide .gui-chip{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;background:#eef2f7;color:#475569;white-space:nowrap;}
  #guide .gui-sw{display:inline-flex;align-items:flex-end;gap:3px;height:34px;padding:2px 4px;border-bottom:1px solid #94a3b8;}
  #guide .gui-sw i{display:inline-block;width:9px;border-radius:2px 2px 0 0;}
  #guide .gui-sw b{display:inline-block;width:22px;height:2px;align-self:center;}
  #guide .gui-span{display:inline-flex;gap:2px;align-items:flex-end;height:30px;}
  #guide .gui-span i{display:inline-block;width:4px;background:#93c5fd;border-radius:1px;}
  #guide .gui-span i.hl{background:#1f77b4;}
  #guide .gui-span i.ytd{background:#ff7f0e;}
  #guide .gui-clock{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid #475569;position:relative;}
  #guide .gui-clock::before{content:"";position:absolute;left:50%;top:5px;width:2px;height:10px;background:#475569;transform:translateX(-50%);}
  @media (max-width:760px){
    #guide{padding:0;} #guide .gcard{height:100vh;border-radius:0;}
    #guide .gwrap{flex-direction:column;}
    #guide .gnav{width:auto;max-height:none;border-right:none;border-bottom:1px solid var(--border);display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:8px 10px;}
    #guide .gnav a{flex:none;border-left:none;border-radius:999px;padding:4px 10px;background:#fff;border:1px solid var(--border);white-space:nowrap;}
    #guide .gnav a.on{border-color:var(--sky700);}
    #guide .gbody{padding:4px 12px 40px;}
    #guide .gpair.side .gshot{max-width:100%;}
    #guide .gshot-scroll{padding:8px;}
    #guide .gflow-list{flex-direction:column;gap:24px;}
    #guide .gflow-step{flex:none;max-width:none;}
    #guide .gflow:not(.gcards) .gflow-step:not(:last-child)::after{content:"↓";right:auto;left:50%;top:auto;bottom:-24px;transform:translateX(-50%);}
  }
  @media print{
    #guide{position:static;background:#fff;padding:0;} #guide .gcard{height:auto;box-shadow:none;border-radius:0;}
    #guide .gnav,#guide .gmove,#guide .gclose,#guide .gfor,#guide .gzoom{display:none !important;} #guide .gbody{overflow:visible;}
    #guide .gsec{content-visibility:visible;} #guide .gsec,#guide .gshot,#guide .gflow-step{break-inside:avoid;}
    body>header,body>.page{display:none !important;}
  }
  .dmcard{max-width:760px;margin:12px auto;border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .dmzone{border:1.5px dashed var(--border);border-radius:10px;padding:14px;margin:12px 0;background:#fafafa;}
  .dmzone h4{margin:0 0 4px;font-size:14px;} .dmzone .hint{font-size:12px;color:var(--muted);margin:0 0 8px;}
  .uplist{margin-top:8px;} .uprow{font-size:12px;padding:3px 0;color:#334155;display:flex;gap:6px;align-items:center;}
  .uprow .st{width:18px;text-align:center;} .uprow .x{margin-left:auto;cursor:pointer;color:#94a3b8;}
</style>
</head>
<body>
<header>
  <span class="logo">AC</span>
  <div><h1>部門損益 可視化 <span class="sub">DeptProfit・build soneki-web-2026-11-12b<span id="apiBuild"></span></span></h1></div>
  <span class="user" id="user"></span>
  <button class="btn ghelp" onclick="openGuide()" title="部門損益利用ガイド（このシステムの使い方）"><svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><path d="M2 3h5a2 2 0 0 1 2 2v9a1.5 1.5 0 0 0-1.5-1.5H2zM14 3H9a2 2 0 0 0-2 2v9a1.5 1.5 0 0 1 1.5-1.5H14z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>利用ガイド</button>
</header>
<div class="page" id="page">
<main id="app"><div class="note">読み込み中…</div></main>
</div>

<script>
"use strict";
/* 部門損益 可視化（soneki）。ヒッスル(PDCA)は別の第3システム（混同禁止）。
   構成: 画面=GitHub Pages ／ データ=GAS API（毎回トークン検証）。Hissuru の型を流用。 */
const IS_LOCAL = (location.hostname==="localhost"||location.hostname==="127.0.0.1"||location.protocol==="file:");
const IS_GAS = !IS_LOCAL;
const CONFIG = {
  GAS_URL: "https://script.google.com/macros/s/AKfycbwtA1LmZwtb2sef-R5XufrxiceE_i3tW6hk9BbhMfuzplX2wxyTiw3upKLDLZUGQbg/exec",   // soneki-gas デプロイ後に /exec URL へ差し替え
  GOOGLE_CLIENT_ID: "1072945615483-74jadmaet56chvhkfh2cpt4ae9dvh140.apps.googleusercontent.com" // Hissuru と共用（同一オリジン）。通すドメインは窓口（GAS）が決める
};
const GAS_READY = IS_GAS && CONFIG.GAS_URL.indexOf("http")===0;

/* ── ログイン: アプリの7日の札（2026-11-12・principles_ux_fast_idempotent.md 型4） ──
   Google のログインは最初の1回だけ。窓口（startSession）が Google の札を1回だけ確かめ、窓口が署名した7日の札を返す。
   以後は札だけを送る（Google の札は持たない・1時間ごとの更新をしない＝作業中にログインの画面が出ない）。
   ログアウトは、この端末の札を捨てるだけ（Google 側の許可は取り消さない＝ほかの端末・同じログイン設定のアプリを落とさない）。
   期限が切れたときの言い方は1つ・お知らせは1回だけ（同時に何本失敗しても、ログインの画面を1回出すだけ）。 */
const SESSION_KEY="soneki_session_v1";
const SESSION_MSG="ログインの期限が切れました。もう一度ログインしてください。";
const LOGIN_FAIL_="Google のログインを確かめられませんでした。もう一度ログインしてください。";
let session=null, oauthTokenClient=null, tokenJob=null, sessionNoticeShown=false;
function readSession_(){ try{ const o=JSON.parse(localStorage.getItem(SESSION_KEY)||"null"); if(!o||typeof o.t!=="string"||!o.e||Date.now()>Number(o.e)-60000) return null; return { t:o.t, e:Number(o.e), email:String(o.email||"") }; }catch(e){ return null; } }
function saveSession_(s){ session=s; try{ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }catch(e){} }
function clearSession_(){ session=null; try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }
function hadExpiredSession_(){ try{ const o=JSON.parse(localStorage.getItem(SESSION_KEY)||"null"); return !!(o && typeof o.t==="string" && o.e && Date.now()>Number(o.e)-60000); }catch(e){ return false; } }
function sessionError_(){ const e=new Error(SESSION_MSG); e.code="SESSION"; return e; }
function isSessionErr_(e){ return !!(e && e.code==="SESSION"); }
/* 札が切れた: ログインの画面を1回だけ出す（2回目以降の失敗は何もしない） */

/* Google のログインの窓（GIS の token client）。callback・error_callback は1度だけ渡し、いま取得中の依頼（1つだけ）へ回す */
function ensureOAuthTokenClient_(){
  if(oauthTokenClient) return;
  if(!(window.google && google.accounts && google.accounts.oauth2)) throw new Error("Google のログインの部品を読み込めていません。ページを読み込み直してください。");
  oauthTokenClient = google.accounts.oauth2.initTokenClient({ client_id: CONFIG.GOOGLE_CLIENT_ID, scope: "openid email profile",
    callback: (resp)=>{ const j=tokenJob; if(!j) return; tokenJob=null;
      if(!resp || resp.error || !resp.access_token) j.reject(new Error(LOGIN_FAIL_)); else j.resolve(resp.access_token); },
    error_callback: (err)=>{ const j=tokenJob; if(!j) return; const t=err&&err.type;
      if(t==="popup_closed"){ if(j.onClosed) j.onClosed(); return; }   // 窓を閉じた: 後から返事が届く端末があるので依頼は生かし、ボタンだけ戻す
      tokenJob=null;
      j.reject(new Error(t==="popup_failed_to_open" ? "ログインの窓を開けませんでした。ブラウザでポップアップを許可してから、もう一度押してください。" : LOGIN_FAIL_)); } });
}
function requestGoogleToken_(onClosed){
  return new Promise((resolve,reject)=>{
    try{ ensureOAuthTokenClient_(); }catch(e){ return reject(e); }
    if(tokenJob){ const old=tokenJob; tokenJob=null; old.reject(Object.assign(new Error(""),{superseded:true})); }   // 押し直し: 前の依頼を取り下げる
    tokenJob={ resolve, reject, onClosed };
    try{ oauthTokenClient.requestAccessToken(); }   // アカウントを選ぶ画面（既定）。7日に1回だけ
    catch(e){ tokenJob=null; reject(e); }
  });
}

async function post_(body, timeoutMs){
  const ctl = timeoutMs ? new AbortController() : null;
  const timer = ctl ? setTimeout(()=>ctl.abort(), timeoutMs) : 0;
  try{
    const res = await fetch(CONFIG.GAS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=UTF-8" }, body: JSON.stringify(body), redirect:"follow", signal: ctl ? ctl.signal : undefined });
    if(!res.ok) throw new Error("HTTP "+res.status);
    return await res.json();
  }catch(e){
    if(e && e.name==="AbortError") throw new Error("窓口の返事がありません。少し待ってから、もう一度ログインしてください。");
    throw e;
  }finally{ if(timer) clearTimeout(timer); }
}
async function gsCall(fn, ...args){
  if(!GAS_READY) throw new Error("GAS_URL 未設定");
  if(!session || Date.now() > session.e) session = readSession_();   // ほかのタブで入り直していれば、その札を使う
  if(!session){ clearSession_(); sessionExpired_(); throw sessionError_(); }
  const sent = session.t;
  const json = await post_({ action:fn, args:args, session:sent });
  if(json && json.error){
    if(json.code==="SESSION"){
      // 返事を待つ間に、このタブかほかのタブで入り直していた: その新しい札で送り直す（新しい札は消さない。札ごとに1回まで）
      const fresh = readSession_();
      const newer = (session && session.t!==sent) ? session : ((fresh && fresh.t!==sent) ? fresh : null);
      if(newer){ session=newer; return gsCall(fn, ...args); }
      clearSession_(); sessionExpired_(); throw sessionError_();   // 端末に残っているのは送った札だけ（または無い）なので、消してよい
    }
    throw new Error(json.error);
  }
  return json.result;
}

function loginBtn_(busy){ const b=$("loginBtn"); if(!b) return; b.disabled=!!busy; b.textContent=busy?"ログインしています…":"Google でログイン"; }
let loginSeq=0;
async function login_(){
  const my=++loginSeq;
  loginBtn_(true);
  const back=setTimeout(()=>{ if(my===loginSeq) loginBtn_(false); }, 20000);   // 窓の返事が来ないとき、20秒でボタンを戻す（押し直せる）
  let done=false;
  try{
    const accessToken = await requestGoogleToken_(()=>{ if(my===loginSeq) loginBtn_(false); });
    busyOverlay_(true, "ログインしています…", "会社のアカウントを確かめています");
    const json = await post_({ action:"startSession", accessToken }, 45000);   // Google の札は、ここで1回だけ窓口へ送る（画面には残さない）・45秒で諦めて戻す
    if(!json || json.error || !json.result || !json.result.session) throw new Error((json && json.error) || LOGIN_FAIL_);
    const r = json.result;
    saveSession_({ t:r.session, e:Number(r.expiresAt)||Date.now()+7*86400000, email:String(r.email||"") });
    sessionNoticeShown=false;
    S.guideData=null;   // 利用ガイドは役割で中身が違う: 入り直したら読み直す
    applyWho_(r);
    busyOverlay_(false);
    done=true;
  }catch(e){
    if(e && e.superseded) return;   // 押し直した: あとの依頼に任せる
    busyOverlay_(false);
    renderLogin_(String(e&&e.message||e) || LOGIN_FAIL_, "error");
  }finally{ clearTimeout(back); if(my===loginSeq) loginBtn_(false); }
  if(done) await resumeAfterLogin_();   // 描く所の失敗を「ログインできない」と見せない
}

  const who = (opts && opts.who) ? gsCall("whoami").catch(e=>({ __err:e })) : null;

  const chk = loadJson("data_check.json").catch(()=>null);

  const w = who ? await who : null;
  if(IS_GAS && !DEMO && !session){ S.meta=null; return; }   // 読み込みの途中でログアウトした・期限が切れた: ログインの画面の上に描かない

  S.wiz={ step:1, kind:null, area:null, store:null };

}

function wizKind_(k){ S.wiz.kind=k; S.wiz.step=2; S.wiz.area=null; S.wiz.store=null; renderWizard_(); }
function wizArea_(a){ S.wiz.area=a; S.wiz.store=null; if(S.wiz.kind==="AREA") S.wiz.step=3; renderWizard_(); }

/* ── 共通セレクト部品 ── */
function areaSelect_(id,fn,val){ return `<select id="${id}" onchange="${fn}(this.value)">`+S.meta.areas.map(a=>`<option value="${esc(a.name)}" ${a.name===val?"selected":""}>${esc(a.name)}</option>`).join("")+`</select>`; }
function storeSelect_(id,fn,area,val){ return `<select id="${id}" onchange="${fn}(this.value)">`+storesOfArea_(area).map(s=>`<option value="${esc(s.slug)}" ${s.slug===val?"selected":""}>${esc(s.store_name)}</option>`).join("")+`</select>`; }
function deptSelect_(id,fn,val,withAll){ return `<select id="${id}" onchange="${fn}(this.value)">`+(withAll?`<option value="ALL" ${val==="ALL"?"selected":""}>合計（全部門）</option>`:"")+S.meta.depts.map(d=>`<option value="${esc(d.name)}" ${d.name===val?"selected":""}>${esc(d.name)}</option>`).join("")+`</select>`; }

/* ── 分析画面（3モード: 総合分析 ／ 比較・内訳 ／ 予算対比） ── */
function modeDesc_(){
  return S.mode==="総合"?"1つの対象を5つの指標で深掘り（総合分析）"
       : S.mode==="比較"?"複数の対象を1つの指標で横比較（比較・内訳）"

function renderDash_(){

/* 予算対比は通常/前年対比の区別を持たないが、S.sub を書き換えると総合へ戻った時に選択が失われる。
   → 予算モードでは S.sub を触らず保持する（描画側は S.mode で分岐しており影響なし） */
function onMode(v){ S.mode=v; renderDash_(); }
function onSub(v){ S.sub=v; renderDash_(); }
function onBaseYm(v){ S.baseYm=v; renderDash_(); }
function onArea(v){ S.area=v; const sts=storesOfArea_(v); if(S.scope!=="AREA"&&!sts.some(s=>s.slug===S.scope)) S.scope="AREA"; renderDash_(); }
function onScope(v){ S.scope=v; renderDash_(); }

function onCompKind(v){ S.comp.kind=v; renderDash_(); }
function onCompArea(v){ S.comp.area=v; S.comp.store=""; renderDash_(); }
function onCompStore(v){ S.comp.store=v; renderDash_(); }
function onCompDept(v){ S.comp.dept=v; renderDash_(); }
function onCompChart(v){ S.comp.chart=v; renderDash_(); }
async function runMode_(){

/* ── v1 チャート（自前SVG: 売上・粗利=棒／粗利率=折線／前年ゴースト） ── */
function fmtK(v){ return Math.round(v).toLocaleString(); }
function niceMax(v){ if(v<=0)return 1; const e=Math.pow(10,Math.floor(Math.log10(v))); const f=v/e; const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*e; }
function prevYm_(ym){ return (parseInt(ym.slice(0,4),10)-1)+ym.slice(4); }
function fmtYm_(ym){ return ym.slice(0,4)+"/"+ym.slice(4); }
/* 基準月フィルタ: S.baseYm 以下の月に絞る（表示窓・累計の末尾を基準月にする） */
function baseAll_(all){ return S.baseYm ? all.filter(r=>r.ym<=S.baseYm) : all; }
function windowRows_(all, yoy){
  const byYm={}; all.forEach(r=>byYm[r.ym]=r);   // 前年参照は基準月フィルタ前の全月から引く
  const base=baseAll_(all);
  // 通常＝基準月から24ヶ月／前年対比＝前年同月データがある月だけを基準月から最大12ヶ月（＝同月対比）
  const disp = yoy ? base.filter(r=>byYm[prevYm_(r.ym)]).slice(-12)
                   : base.slice(-Math.min(S.meta.display_months||24, base.length));
  return disp.map(r=>({ ...r, prev: byYm[prevYm_(r.ym)]||null }));
}
function card_(title,sub,svg){ return `<div class="chartcard"><div class="chead"><b>${title}</b><span class="lb">${sub}</span></div>${svg}</div>`; }

/* ── 総合分析（Deep Dive: 1対象×5指標の縦積み） ── */
async function runDeep_(){
  const w=$("chartwrap"); if(w) w.innerHTML=`<div class="note">読み込み中…</div>`;
  const fname=`series/${aslug_(S.area)}__${dslug_(S.dept)}__${S.scope}.json`;
  try{ S.series = await loadJson(fname); }
  catch(e){ if(w) w.innerHTML=storeNotes_()+loadFailCard_(e, fname); return; }
  renderDeepCharts_();
}
function renderDeepCharts_(){
  const w=$("chartwrap"); if(!w||!S.series) return;
  renderScopeChips_();
  const allRaw=S.series.months||[];
  const all=baseAll_(allRaw);   // 累計(YTD)も基準月時点で締める
  if(!all.length){ w.innerHTML=storeNotes_()+noBaseCard_(allRaw); return; }
  const yoy=(S.sub==="前年対比");
  const rows=windowRows_(allRaw,yoy);
  // 管理が変わった部門（ベーカリー）は、前年と比べられる月が一部に残っていても前年対比を出さない（金額0の月との比較になるため）
  if(yoy && (absorbed_(S.dept) || !rows.length)){ w.innerHTML=storeNotes_()+(absorbed_(S.dept)?absorbedCard_(S.dept,"yoy","onDept"):noPrevCard_(allRaw)); return; }
  const dispN=rows.length;
  const isDept=(S.dept!=="ALL");
  const sub=(t)=>`${t}${yoy?"／前年=灰・改善は濃く/悪化は淡く":""}`;
  // 累計(YTD)は原本と同じく「各チャートの右横に置く細い棒チャート」（前年対比のときだけ）
  const ytd=(series,title,rates)=>yoy?ytdBars_(all,series,title,rates):"";
  let html=
    card_("① 売上・粗利・粗利率", `直近${dispN}ヶ月・金額=千円${yoy?"／右軸=粗利率改善pt（緑=改善・赤=悪化）":""}`,
      withYtd_(svgSalesMargin_(rows,yoy), ytd([{key:"sales",name:"売上",fill:"#1f77b4"},{key:"gross_profit",name:"粗利",fill:"#ff7f0e"}],"年度 月平均",YTD_RATES["①"])))+
    card_("② ロス管理（廃棄・値引）", yoy?sub("廃棄・値引を前年と対比（減っていれば改善）"):`積み上げ棒＝金額／折線＝率（右軸）`,
      withYtd_(svgLoss_(rows,yoy), ytd([{key:"waste_amount",name:"廃棄",fill:"#d62728",lowerBetter:true},{key:"discount_amount",name:"値引",fill:"#C71585",lowerBetter:true}],"年度 月平均",YTD_RATES["②"])));
  if(yoy){
    svgCostYoY6_(rows).forEach(c=>{ html+=card_(c.title, sub("費用は減っていれば改善"),
      withYtd_(c.svg, ytdBars_(all,[{key:c.key,name:c.label,fill:c.color,lowerBetter:true}],"年度 月平均"))); });
  } else html+=card_("③ 経費構造推移（販管費内訳）", `積み上げ棒・金額=千円`, svgCostBreakdown_(rows));
  // ④は原本準拠で2枚: ④-1 営業利益（常時）／④-2 部門貢献利益（部門を選んでいるときだけ追加）
  html+=card_("④-1 営業利益", sub(S.dept==="ALL"?"営業利益（黒字=橙・赤字=青）":"この部門の営業利益"),
    withYtd_(svgProfit_(rows,"ALL",yoy), ytd([{key:"operating_profit",name:"営業利益",fill:"#ff7f0e"}],"年度 月平均")));
  if(isDept){
    html+=card_("④-2 部門貢献利益", sub("配賦前（青） vs 配賦後（水色）"),
      withYtd_(svgProfit_(rows,S.dept,yoy), ytd([{key:"cont_profit_pre",name:"配賦前",fill:"#1f77b4"},{key:"cont_profit_post",name:"配賦後",fill:"#17becf"}],"年度 月平均")));
  }
  html+=card_("⑤ 労働生産性", sub("人時売上（青）・人時生産性（緑）・円/人時"),
    withYtd_(svgProductivity_(rows,yoy), ytd([{key:"sales_per_man_hour",name:"人時売上",fill:"#1f77b4"},{key:"productivity_per_man_hour",name:"人時生産性",fill:"#2ca02c"}],"年度 月平均")));
  w.innerHTML=storeNotes_()+absorbedCard_(S.dept,"note","")+html;
}

/* ── 比較・内訳（Comparison: 複数対象×1指標の縦並び） ── */
const SGA_DEF={ "③-0":["sga_total","販管費計","#8c564b"], "③-1":["sga_personnel","人件費","#1f77b4"], "③-2":["sga_selling","販売費","#ff7f0e"], "③-3":["sga_admin_a","管理費A","#bcbd22"], "③-4":["sga_admin_b","管理費B","#2ca02c"], "③-5":["sga_depreciation","減価償却費","#9467bd"] };
function compChartOptions_(){
  const yoy=(S.sub==="前年対比");
  const o=[["①","① 売上・粗利・粗利率"],["②","② ロス管理"]];
  if(!yoy) o.push(["③","③ 販管費内訳（全体）"]);   // 原本準拠: 前年対比では全体積み上げは非表示（個別のみ）
  o.push(["③-0","③-0 販管費計"],["③-1","③-1 人件費"],["③-2","③-2 販売費"],["③-3","③-3 管理費A"],["③-4","③-4 管理費B"],["③-5","③-5 減価償却費"],["④-1","④-1 営業利益"]);
  // ④-2 部門貢献利益は「部門を見ているとき」だけ（原本 app.py: is_dept_mode）
  const deptMode=(S.comp.kind==="STORE_DEPTS")||(S.comp.dept&&S.comp.dept!=="ALL");
  if(deptMode) o.push(["④-2","④-2 部門貢献利益"]);
  o.push(["⑤","⑤ 労働生産性"]);
  return o;
}
function compChartLabel_(){ const x=compChartOptions_().find(a=>a[0]===S.comp.chart); return x?x[1]:S.comp.chart; }
function chartFor_(key,rows,yoy,dept){
  if(key==="①") return svgSalesMargin_(rows,yoy);
  if(key==="②") return svgLoss_(rows,yoy);
  if(key==="③") return svgCostBreakdown_(rows);
  if(SGA_DEF[key]){ const d=SGA_DEF[key]; return svgCostSingle_(rows,d[0],d[1],d[2],yoy); }
  if(key==="④-1") return svgProfit_(rows,"ALL",yoy);                      // 営業利益
  if(key==="④-2") return svgProfit_(rows,(dept&&dept!=="ALL")?dept:"D",yoy); // 部門貢献利益（配賦前/後）
  if(key==="④")   return svgProfit_(rows,dept,yoy);                       // 旧キーの保険
  return svgProductivity_(rows,yoy);
}
/* 累計チャートの率pt定義（原本 chart_sales_margin_ytd / chart_loss_ytd 準拠・PO指摘 2026-07-29）:
   ①=粗利率改善pt ／ ②=廃棄率・値引率・ロス率計の改善pt（縁=当該指標色・塗り=緑改善/赤悪化） */
const YTD_RATES={
  "①":[{name:"粗利率",edge:"#d62728",num:"gross_profit",den:"sales"}],
  "②":[{name:"廃棄率",edge:"#d62728",num:"waste_amount",den:"sales",lowerBetter:true},
       {name:"値引率",edge:"#C71585",num:"discount_amount",den:"sales",lowerBetter:true},
       {name:"ロス率計",edge:"#FFAB00",num:["waste_amount","discount_amount"],den:"sales",lowerBetter:true}]
};
function ytdRatesFor_(key){ return YTD_RATES[key]||null; }
/* 比較・内訳の前年対比: チャート種別→累計(YTD)系列の対応（総合分析と同じマッピング・PO指摘 2026-07-29） */
function ytdSeriesFor_(key){
  if(key==="①") return [{key:"sales",name:"売上",fill:"#1f77b4"},{key:"gross_profit",name:"粗利",fill:"#ff7f0e"}];
  if(key==="②") return [{key:"waste_amount",name:"廃棄",fill:"#d62728",lowerBetter:true},{key:"discount_amount",name:"値引",fill:"#C71585",lowerBetter:true}];
  if(SGA_DEF[key]){ const d=SGA_DEF[key]; return [{key:d[0],name:d[1],fill:d[2],lowerBetter:true}]; }
  if(key==="④-1") return [{key:"operating_profit",name:"営業利益",fill:"#ff7f0e"}];
  if(key==="④-2"||key==="④") return [{key:"cont_profit_pre",name:"配賦前",fill:"#1f77b4"},{key:"cont_profit_post",name:"配賦後",fill:"#17becf"}];
  return [{key:"sales_per_man_hour",name:"人時売上",fill:"#1f77b4"},{key:"productivity_per_man_hour",name:"人時生産性",fill:"#2ca02c"}];
}
async function runComp_(){
  const w=$("chartwrap"); if(!w) return;
  const c=S.comp;
  if(!compChartOptions_().some(o=>o[0]===c.chart)) c.chart="①";   // 前年対比で③全体が消えた時の受け皿
  let targets=[];
  if(c.kind==="AREAS"){
    targets=S.meta.areas.map(a=>({label:`${a.name}（エリア合計）`, file:`series/${a.slug}__${c.dept==="ALL"?"ALL":dslug_(c.dept)}__AREA.json`, dept:c.dept}));
  } else if(c.kind==="STORE_DEPTS"){
    const sts=storesOfArea_(c.area); const st=sts.find(s=>s.slug===c.store)||sts[0];
    if(!st){ w.innerHTML=`<div class="note">このエリアに店舗がありません。</div>`; return; }
    c.store=st.slug;
    targets=[{label:`${st.store_name}｜合計（全部門）`, file:`series/${aslug_(c.area)}__ALL__${st.slug}.json`, dept:"ALL"}]
      .concat(S.meta.depts.map(d=>({label:`${st.store_name}｜${d.name}`, file:`series/${aslug_(c.area)}__${d.slug}__${st.slug}.json`, dept:d.name})));
  } else {
    targets=[{label:`${c.area}（エリア合計）`, file:`series/${aslug_(c.area)}__${c.dept==="ALL"?"ALL":dslug_(c.dept)}__AREA.json`, dept:c.dept}]
      .concat(storesOfArea_(c.area).map(s=>({label:s.store_name, file:`series/${aslug_(c.area)}__${c.dept==="ALL"?"ALL":dslug_(c.dept)}__${s.slug}.json`, dept:c.dept})));
  }
  w.innerHTML=`<div class="note">読み込み中…（${targets.length}件）</div>`;
  const yoy=(S.sub==="前年対比");
  const results=await Promise.all(targets.map(async t=>{ try{ return {t, s:await loadJson(t.file)}; }catch(e){ return {t, s:null, e}; } }));
  const cards=[], skipped=[];
  for(const x of results){
    const ms=(x.s&&x.s.months)||[];
    if(!ms.length){ skipped.push({label:x.t.label, file:x.t.file, dept:x.t.dept, e:x.e||"データが空です"}); continue; }   // カードは出さず、下に理由をまとめる
    const rows=windowRows_(ms,yoy);
    if(!rows.length || (yoy && absorbed_(x.t.dept))){ skipped.push({label:x.t.label, file:x.t.file, dept:x.t.dept, noPrev:true, last:ms[ms.length-1].ym, range:fmtRange_(ms[0].ym, ms[ms.length-1].ym)}); continue; }
    // 前年対比は総合分析と同じく右横に累計(YTD)を併記（基準月時点で締める）
    const ytdSvg=yoy?ytdBars_(baseAll_(x.s.months||[]), ytdSeriesFor_(c.chart), "年度 月平均", ytdRatesFor_(c.chart)):"";
    cards.push(card_(esc(x.t.label), `${esc(compChartLabel_())}・${yoy?"前年対比"+rows.length+"ヶ月":"直近"+rows.length+"ヶ月"}`, withYtd_(chartFor_(c.chart,rows,yoy,x.t.dept), ytdSvg)));
  }
  renderScopeChips_();
  const deptNote=(cards.length && c.kind!=="STORE_DEPTS") ? absorbedCard_(c.dept,"note","") : "";
  w.innerHTML = deptNote + cards.join("") + compSkippedCard_(skipped, yoy, cards.length);
}
/* 原本にその部門の行がもともと無い（meta の depts に無い）＝欠けていて正常。ALL は常にあるべきなので対象外 */
function expectedMissing_(file){
  const m=String(file).match(/series\/([^_]+)__([^_]+)__(.+)\.json$/); if(!m) return false;
  const dept=(S.meta.depts||[]).find(d=>d.slug===m[2]); if(!dept) return false;
  const holder=(m[3]==="AREA") ? (S.meta.areas||[]).find(a=>a.slug===m[1]) : storeOf_(m[3]);
  return !!(holder && holder.depts && holder.depts.indexOf(dept.name)<0);
}
/* 表示期間（前年対比＝基準月から12ヶ月）の最初の月 */
function winStart_(){
  const end=S.baseYm||(S.meta.months||[]).slice(-1)[0]||""; if(!end) return "";
  let y=+end.slice(0,4), m=+end.slice(4)-11; while(m<1){ m+=12; y--; }
  return `${y}${String(m).padStart(2,"0")}`;
}
/* 比較・内訳で表示できなかった対象を、理由つきで1枚にまとめる（取得失敗があれば要連絡、前年が無い・原本に行が無いだけなら注意）。
   並べて比べる画面（エリア比較・店舗比較）では、表示期間より前に終わった店（閉店など）は選んでいないので載せない */
function compSkippedCard_(skipped, yoy, nCards){
  const c=S.comp, ws=winStart_();
  // 管理が変わった部門（ベーカリー）は、表示できないのが正常。個別の行に並べず、お知らせ1枚にまとめる
  const abs=skipped.filter(s=>absorbed_(s.dept) && (s.noPrev || (s.e && isNoFile_(s.e) && !expectedMissing_(s.file))));   // もともと行が無い店は数えない
  skipped=skipped.filter(s=>abs.indexOf(s)<0);
  const note=(abs.length && (yoy || !nCards)) ? absorbedCard_(abs[0].dept, yoy?"yoy":"none", c.kind==="STORE_DEPTS"?"":"onCompDept") : "";
  const list=skipped.filter(s=>!(s.e && isNoFile_(s.e) && expectedMissing_(s.file))
                            && !(s.noPrev && c.kind!=="STORE_DEPTS" && ws && s.last && s.last<ws));
  const fail=list.some(s=>s.e && !isNoFile_(s.e)), noPrev=list.some(s=>s.noPrev);
  const code=k=>[k, "comp", c.kind, aslug_(c.area), c.store, dslug_(c.dept), c.chart].filter(Boolean).join("/")+` (${buildId_()})`;
  if(!list.length) return note + ((nCards || note) ? "" : alertCard_("warn", code("E03"), "この条件で表示できるデータがありません", "選んだ部門の行が、対象の原本にありません。"));
  const lines=list.map(s=> s.noPrev ? `・${s.label}: ${yoy?"前年同月":"基準月以前"}のデータがありません（データは ${s.range}）`
    : isNoFile_(s.e) ? `・${s.label}: この範囲のデータがありません`
    : `・${s.label}: 取得に失敗しました（${String(s.e&&s.e.message||s.e)}）`).join("\n");
  return note + alertCard_(fail?"err":"warn", code(fail?"E02":(noPrev?"E04":"E03")), `表示できなかった対象があります（${list.length}件）`, lines,
    (yoy && noPrev) ? `<button class="btn" onclick="onSub('通常')">「通常」表示に切り替える</button>` : "");
}

/* ── 予算対比（Budget vs Actual: 12ヶ月窓。予算未取込なら案内） ── */
async function runBudget_(){
  const w=$("chartwrap"); if(w) w.innerHTML=`<div class="note">読み込み中…</div>`;
  const fname=`series/${aslug_(S.area)}__${dslug_(S.dept)}__${S.scope}.json`;
  try{ S.series = await loadJson(fname); }
  catch(e){ if(w) w.innerHTML=storeNotes_()+loadFailCard_(e, fname); return; }
  renderScopeChips_();
  const all=baseAll_(S.series.months||[]);   // 基準月まで（累計も基準月時点で締める）
  const hasBudget=all.some(r=>(r.budget_sales||0)>0||(r.budget_gross_profit||0)>0);
  if(!hasBudget){
    w.innerHTML=storeNotes_()+absorbedCard_(S.dept,"note","")+`<div class="chartcard" style="max-width:720px"><div class="chead"><b>予算対比</b></div>`+
      `<div class="note" style="padding:8px 2px">この範囲の<b>予算データが未取込</b>のため、予算対比はまだ表示できません。<br>`+
      `年度予算Excelの取込（⚙️ データ管理 → ② 年度予算Excel）と本部側の処理が完了すると、`+
      `実績vs予算（灰=予算・達成=濃・未達=淡）と粗利率差pt（緑=改善・赤=悪化）をここに表示します。</div></div>`;
    return;
  }
  const rows=all.slice(-12);
  w.innerHTML=storeNotes_()+absorbedCard_(S.dept,"note","")+card_("予算対比（実績 vs 予算）", `直近${rows.length}ヶ月・灰=予算／実績=達成100%・未達40%／折線=粗利率差pt（右軸・緑=改善/赤=悪化）／右=年度累計（実績 vs 予算）`, withYtd_(svgBudget_(rows), ytdBudgetBars_(all)));
}
/* 率プロットの当たり判定拡大: 小さな可視点の上に透明ヒット円(title持ち)を重ねる（PO指摘 2026-07-29: 率のツールチップが実用上出ない） */
function ptHit_(cx,cy,tip,r){ return `<circle cx="${cx}" cy="${cy}" r="${r||9}" fill="transparent" pointer-events="all"><title>${tip}</title></circle>`; }
/* 横軸の年月ラベル: 月は毎月表示・年（YY/）は先頭と1月のみ付す（PO要望 2026-07-29） */
function xMonthTicks_(rows, cx, y1){
  let g="";
  rows.forEach((r,i)=>{ const c=cx(i), mm=r.ym.slice(4), lab=(i===0||mm==="01")?`${r.ym.slice(2,4)}/${mm}`:mm;
    g+=`<text x="${c.toFixed(1)}" y="${(y1+13).toFixed(1)}" text-anchor="end" font-size="10.5" fill="#475569" transform="rotate(-60 ${c.toFixed(1)} ${(y1+13).toFixed(1)})">${lab}</text>`; });
  return g;
}
function chartBase_(rows, o){
  const W=1000,H=430,mL=68,mR=(o.maxRight!=null?68:28),mT=10,mB=58;
  const x0=mL,x1=W-mR,y0=mT,y1=H-mB,pw=x1-x0,ph=y1-y0,n=rows.length,bw=pw/n;
  // minLeft を渡すと符号付き軸（0線あり）。未指定＝従来どおり 0 起点
  const maxL=niceMax(o.maxLeft||1), minL=(o.minLeft<0)?-niceMax(-o.minLeft):0;
  const maxR=(o.maxRight!=null)?niceMax(o.maxRight||0.1):null;
  const yL=v=>y1-((v-minL)/(maxL-minL))*ph, yR=v=>maxR?y1-(v/maxR)*ph:0, cx=i=>x0+bw*(i+0.5);
  let g=""; const T=4;
  for(let t=0;t<=T;t++){ const val=minL+(maxL-minL)*t/T, y=yL(val);
    g+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="${(minL<0&&Math.abs(val)<1e-9)?'#cbd5e1':'#eef2f7'}"/>`;
    g+=`<text x="${x0-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="11" fill="#475569">${fmtK(val)}</text>`;
    if(maxR!=null) g+=`<text x="${x1+6}" y="${(yR(maxR*t/T)+3).toFixed(1)}" text-anchor="start" font-size="11" fill="#475569">${o.rightPct?(maxR*t/T*100).toFixed(1)+"%":fmtK(maxR*t/T)}</text>`;
  }
  const midY=(y0+ph/2).toFixed(1);
  g+=`<text x="22" y="${midY}" transform="rotate(-90 22 ${midY})" text-anchor="middle" font-size="11" fill="#475569">${esc(o.leftTitle||"金額(千円)")}</text>`;
  if(o.rightTitle) g+=`<text x="${W-20}" y="${midY}" transform="rotate(90 ${W-20} ${midY})" text-anchor="middle" font-size="11" fill="#475569">${esc(o.rightTitle)}</text>`;
  g+=xMonthTicks_(rows,cx,y1);
  g+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#cbd5e1"/>`;
  return {frame:g, yL, yR, cx, x0, x1, y1, yz:yL(0), bw, W, H, n};
}
/* 凡例。文字を11.5pxへ拡大したのに合わせ、viewBox高さ14→18・ベースライン9.5→12.5に拡げる（上下の見切れ防止） */
function legendSvg_(items, x0, W){ let lx=x0,lg=""; items.forEach(a=>{ lg+=`<rect x="${lx}" y="3" width="12" height="12" rx="2" fill="${a[0]}"/><text x="${lx+16}" y="12.5" font-size="11.5" fill="#334155">${a[1]}</text>`; lx+=16+a[1].length*13+16; }); return `<svg viewBox="0 0 ${W} 18" style="width:100%;height:20px" role="img">${lg}</svg>`; }
function svgWrap_(b, body){ return `<svg viewBox="0 0 ${b.W} ${b.H}" style="width:100%;height:auto" role="img">${b.frame}${body}</svg>`; }

/* ── 前年対比の棒の描き方（オリジナル charts.py 準拠） ───────────────────────
   ・1ヶ月に2系列（①売上/粗利・②廃棄/値引・④配賦前/配賦後・⑤人時売上/生産性）
       → 系列を左右に振り分けて2本並べ、前年は「幅を狭めて同じ位置に重ねる」
         （原本: ghost size15〜20 opacity .3〜.5 ／ 当年 size30）
   ・1ヶ月に1系列（③各費目・④営業利益）
       → 前年を左に、当年を右に「少しずらす」（原本: xOffset -5 / +5・ghost size20 / 当年 size30）
   ・当年の濃さ = 改善なら不透明1.0／悪化なら淡く（原本 0.3〜0.4）                     */
const YOY_GHOST="#b6b6b6";
function yoyGeom_(bw, nSeries){
  if(nSeries>=2){
    // 2系列: 系列ごとに左右へ。前年は同位置で細く重ねる（原本の xOffset(label) 相当）
    const w=Math.max(3,bw*0.30), gw=Math.max(2,w*0.5), dx=bw*0.19;
    return { w, gw, off:i=>(i===0?-dx:dx), gOff:i=>(i===0?-dx:dx), gOpacity:0.5 };
  }
  // 1系列: 前年を左・当年を右へずらす（原本の -5/+5 相当）
  const w=Math.max(4,bw*0.34), gw=Math.max(3,bw*0.24), dx=bw*0.13;
  return { w, gw, off:()=>dx, gOff:()=>-dx, gOpacity:0.5 };
}
/** 前年対比の棒ペアを描く。vals=[{v,prev,fill,name}] （1〜2系列） */
function yoyBars_(b, i, vals){
  const G=yoyGeom_(b.bw, vals.length), c=b.cx(i);
  let g="";
  vals.forEach((s,si)=>{
    const yz=b.yz!=null?b.yz:b.y1;
    const bar=(x,w,v,fill,op,tip)=>{ const yv=b.yL(v), top=Math.min(yv,yz), h=Math.max(0.5,Math.abs(yz-yv));
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" opacity="${op}"><title>${tip}</title></rect>`; };
    if(s.prev!=null) g+=bar(c+G.gOff(si)-G.gw/2, G.gw, s.prev, YOY_GHOST, G.gOpacity, `前年 ${s.name} ${fmtK(s.prev)}`);
    const improved = s.prev==null ? true : (s.lowerBetter ? (s.v<s.prev) : (s.v>=s.prev));
    const d=s.prev!=null?s.v-s.prev:null;
    const yoyTxt=s.prev!=null?`（前年 ${fmtK(s.prev)}・差 ${(d>=0?"+":"−")+fmtK(Math.abs(d))}${s.prev!==0?`・前年比 ${(s.v/s.prev*100).toFixed(1)}%`:""}・${improved?"改善":"悪化"}）`:"";
    g+=bar(c+G.off(si)-G.w/2, G.w, s.v, s.fill, (improved?1:0.35),
      `${s.ym||""} ${s.name} ${fmtK(s.v)}${yoyTxt}`);
  });
  return g;
}
/* ── 年度 月平均: 各チャートの右横に置く細い「棒」チャート（原本は columns([5,1]) の側チャート） ──
   2026-08-24 PO指示で「累計の合算」→【月平均】表示へ変更（4〜7月なら4ヶ月の平均）。ツールチップは月平均と合計を併記。
   系列ごとに 前年=灰の細棒＋当年=色棒 を並べる。線グラフではない。 */
function ytdBars_(all, series, title, rates){
  if(!all.length) return "";
  const last=all[all.length-1].ym, y=+last.slice(0,4), m=+last.slice(4), fy=(m>=4?y:y-1);
  const cur=all.filter(r=>r.ym>=`${fy}04` && r.ym<=last);
  const prev=all.filter(r=>r.ym>=`${fy-1}04` && r.ym<=`${y-1}${last.slice(4)}`);
  if(!cur.length) return `<div class="note">当年度の累計データがありません。</div>`;
  const sum=(arr,k)=>Array.isArray(k)?k.reduce((s,kk)=>s+arr.reduce((a,r)=>a+(r[kk]||0),0),0):arr.reduce((s,r)=>s+(r[k]||0),0);
  // 2026-08-24 PO指示: 金額の目盛りは「累計の合算」ではなく【月平均】で表示する（4〜7月なら4ヶ月の平均）。
  //   当年・前年それぞれ自分の月数で割る（月数が食い違う期間でも比較が成立する）。
  //   ※率pt（改善pt）は合計から算出する指標のため平均化しない（下の hasRates ブロックは従来どおり）
  const nCur=cur.length, nPrev=prev.length;
  const items=series.map(s=>{
    const tv=sum(cur,s.key), tp=nPrev?sum(prev,s.key):null;
    return { name:s.name, fill:s.fill, lowerBetter:!!s.lowerBetter,
      v:(nCur?tv/nCur:0), prev:(tp!=null&&nPrev)?tp/nPrev:null,   // 表示・目盛りは月平均
      total:tv, totalPrev:tp };                                    // ツールチップ用に合計も保持
  });
  let mx=0,mn=0; items.forEach(it=>{ mx=Math.max(mx,it.v,it.prev||0); mn=Math.min(mn,it.v,it.prev||0); });
  const hasRates=!!(rates&&rates.length&&prev.length);
  const W=260,H=430,mL=52,mR=hasRates?40:10,mT=10,mB=58,x0=mL,x1=W-mR,y0=mT,y1=H-mB,ph=y1-y0,pw=x1-x0;
  const MX=mx>0?niceMax(mx):1, MN=mn<0?-niceMax(-mn):0;
  const yL=v=>y1-((v-MN)/(MX-MN))*ph, yz=yL(0);
  let g=""; const T=4;
  for(let t=0;t<=T;t++){ const val=MN+(MX-MN)*t/T, yy=yL(val);
    g+=`<line x1="${x0}" y1="${yy.toFixed(1)}" x2="${x1}" y2="${yy.toFixed(1)}" stroke="${(MN<0&&Math.abs(val)<1e-9)?'#cbd5e1':'#eef2f7'}"/>`+
       `<text x="${x0-5}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="11" fill="#475569">${fmtK(val)}</text>`; }
  const slot=pw/items.length;
  items.forEach((it,i)=>{
    const c=x0+slot*(i+0.5), w=Math.max(8,slot*0.34), gw=Math.max(5,slot*0.22), dx=slot*0.13;
    const bar=(x,bw2,v,fill,op,tip)=>{ const yv=yL(v), top=Math.min(yv,yz), h=Math.max(0.5,Math.abs(yz-yv));
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw2.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" opacity="${op}"><title>${tip}</title></rect>`; };
    // ツールチップは【月平均】と【合計】を併記（PO指示 2026-08-24）。棒の高さ＝月平均
    if(it.prev!=null) g+=bar(c-dx-gw/2, gw, it.prev, YOY_GHOST, 0.5,
      `前年 ${it.name}｜月平均 ${fmtK(it.prev)}／合計 ${fmtK(it.totalPrev)}（${nPrev}ヶ月）`);
    const improved = it.prev==null ? true : (it.lowerBetter ? (it.v<it.prev) : (it.v>=it.prev));
    const diff=it.prev!=null?it.v-it.prev:null;
    const yoyTxt=it.prev!=null?`\n前年 月平均 ${fmtK(it.prev)}／合計 ${fmtK(it.totalPrev)}（${nPrev}ヶ月）`+
      `\n差 ${(diff>=0?"+":"−")+fmtK(Math.abs(diff))}（月平均）${it.prev!==0?`・前年比 ${(it.v/it.prev*100).toFixed(1)}%`:""}・${improved?"改善":"悪化"}`:"";
    g+=bar(c+dx-w/2, w, it.v, it.fill, (improved?1:0.35),
      `当年 ${it.name}｜月平均 ${fmtK(it.v)}／合計 ${fmtK(it.total)}（${nCur}ヶ月）${yoyTxt}`);
    g+=`<text x="${c.toFixed(1)}" y="${(y1+14).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#475569">${esc(it.name)}</text>`;
  });
  // 率の累計改善pt（原本 chart_*_ytd 準拠: 塗り=緑改善/赤悪化・縁=当該指標色・右軸=0中央の対称スケール・ゼロ破線）
  if(hasRates){
    const pts=rates.map(rt=>{
      const cd=sum(cur,rt.den), pd_=sum(prev,rt.den);
      if(!cd||!pd_) return null;
      const cr=sum(cur,rt.num)/cd, pr=sum(prev,rt.num)/pd_;
      const pt=(rt.lowerBetter?(pr-cr):(cr-pr))*100;
      return {name:rt.name, edge:rt.edge, pt, cr, pr};
    }).filter(Boolean);
    if(pts.length){
      let mxp=0; pts.forEach(p=>mxp=Math.max(mxp,Math.abs(p.pt))); mxp=Math.max(0.1,mxp*1.15);
      const yP=v=>y0+ph/2-(v/mxp)*(ph/2), zy=yP(0);
      g+=`<line x1="${x0}" y1="${zy.toFixed(1)}" x2="${x1}" y2="${zy.toFixed(1)}" stroke="#0f172a" stroke-dasharray="4 4" opacity="0.55"/>`;
      [mxp,0,-mxp].forEach(v=>{ g+=`<text x="${x1+3}" y="${(yP(v)+3).toFixed(1)}" font-size="10" fill="#475569">${v===0?"0":(v>0?"+":"−")+Math.abs(v).toFixed(1)}</text>`; });
      pts.forEach((p,i)=>{
        const px=(x0+pw*(pts.length>1?(0.25+0.5*i/(pts.length-1)):0.5)).toFixed(1), py=yP(p.pt).toFixed(1);
        const tip=`累計${p.name} ${p.pt>=0?"改善":"悪化"} ${(p.pt>=0?"+":"")+p.pt.toFixed(2)}pt（当年 ${(p.cr*100).toFixed(2)}%・前年 ${(p.pr*100).toFixed(2)}%）`;
        g+=`<circle cx="${px}" cy="${py}" r="5" fill="${p.pt>=0?"#15803d":"#dc2626"}" stroke="${p.edge}" stroke-width="2"/>`+ptHit_(px,py,tip,16);
      });
    }
  }
  g+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#cbd5e1"/>`;
  // 目盛りが月平均であることを明示（合算と誤解されないように月数も出す）
  const label=`${fy}年度 4月〜${last.slice(4)}月（${nCur}ヶ月）の月平均`;

/* ── 年度累計 予算対比: 灰=予算累計・実績=達成1.0/未達0.4（原本 chart_budget_vs_actual_ytd 準拠・2026-07-29 PO指摘の移植漏れ対応） ──
   実績・予算とも「当年度内で予算が入っている月」だけで合算し、月集合を揃えてミスリードを防ぐ */
function ytdBudgetBars_(all){
  if(!all.length) return "";
  const last=all[all.length-1].ym, y=+last.slice(0,4), m=+last.slice(4), fy=(m>=4?y:y-1);
  const cur=all.filter(r=>r.ym>=`${fy}04` && r.ym<=last && ((r.budget_sales||0)>0||(r.budget_gross_profit||0)>0));
  if(!cur.length) return "";
  const sum=k=>cur.reduce((s,r)=>s+(r[k]||0),0);
  // 2026-08-24 PO指示: 金額の目盛りは【月平均】表示（実績・予算とも同じ月集合なので同じ月数で割る）
  //   ※粗利率差ptは合計から算出する指標のため平均化しない（下の as/ag/bs/bg は合計のまま）
  const nCur=cur.length, avg=k=>nCur?sum(k)/nCur:0;
  const items=[
    {name:"売上", fill:"#1f77b4", v:avg("sales"),        bud:avg("budget_sales"),
     total:sum("sales"),        totalBud:sum("budget_sales")},
    {name:"粗利", fill:"#ff7f0e", v:avg("gross_profit"), bud:avg("budget_gross_profit"),
     total:sum("gross_profit"), totalBud:sum("budget_gross_profit")}
  ];
  let mx=0; items.forEach(it=>{ mx=Math.max(mx,it.v,it.bud); });
  const W=260,H=430,mL=52,mR=40,mT=10,mB=58,x0=mL,x1=W-mR,y0=mT,y1=H-mB,ph=y1-y0,pw=x1-x0;
  const MX=mx>0?niceMax(mx):1, yL=v=>y1-(v/MX)*ph;
  let g=""; const T=4;
  for(let t=0;t<=T;t++){ const val=MX*t/T, yy=yL(val);
    g+=`<line x1="${x0}" y1="${yy.toFixed(1)}" x2="${x1}" y2="${yy.toFixed(1)}" stroke="#eef2f7"/>`+
       `<text x="${x0-5}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="11" fill="#475569">${fmtK(val)}</text>`; }
  const slot=pw/items.length;
  items.forEach((it,i)=>{
    const c=x0+slot*(i+0.5), w=Math.max(8,slot*0.34), gw=Math.max(5,slot*0.22), dx=slot*0.13;
    const bar=(x,bw2,v,fill,op,tip)=>{ const yv=yL(v), h=Math.max(0.5,y1-yv);
      return `<rect x="${x.toFixed(1)}" y="${yv.toFixed(1)}" width="${bw2.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" opacity="${op}"><title>${tip}</title></rect>`; };
    // ツールチップは【月平均】と【合計】を併記（PO指示 2026-08-24）。棒の高さ＝月平均
    if(it.bud>0) g+=bar(c-dx-gw/2, gw, it.bud, "#c0c0c0", 0.55,
      `予算 ${it.name}｜月平均 ${fmtK(it.bud)}／合計 ${fmtK(it.totalBud)}（${nCur}ヶ月）`);
    const ok=(it.bud<=0)||it.v>=it.bud;
    const bdiff=it.v-it.bud;
    g+=bar(c+dx-w/2, w, it.v, it.fill, (ok?1:0.4),
      `実績 ${it.name}｜月平均 ${fmtK(it.v)}／合計 ${fmtK(it.total)}（${nCur}ヶ月）`+
      (it.bud>0?`\n予算 月平均 ${fmtK(it.bud)}／合計 ${fmtK(it.totalBud)}`+
        `\n差 ${(bdiff>=0?"+":"−")+fmtK(Math.abs(bdiff))}（月平均）・達成率 ${(it.v/it.bud*100).toFixed(1)}%`:""));
    g+=`<text x="${c.toFixed(1)}" y="${(y1+14).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#475569">${esc(it.name)}</text>`;
  });
  // 累計粗利率差pt（実績累計粗利率 − 予算累計粗利率。塗り=緑/赤・縁=粗利率色・右軸=0中央の対称スケール）
  const as=sum("sales"), ag=sum("gross_profit"), bs=sum("budget_sales"), bg=sum("budget_gross_profit");
  if(as>0&&bs>0){
    const cr=ag/as, br=bg/bs, pt=(cr-br)*100;
    const mxp=Math.max(0.1,Math.abs(pt)*1.15);
    const yP=v=>y0+ph/2-(v/mxp)*(ph/2), zy=yP(0);
    g+=`<line x1="${x0}" y1="${zy.toFixed(1)}" x2="${x1}" y2="${zy.toFixed(1)}" stroke="#0f172a" stroke-dasharray="4 4" opacity="0.55"/>`;
    [mxp,0,-mxp].forEach(v=>{ g+=`<text x="${x1+3}" y="${(yP(v)+3).toFixed(1)}" font-size="10" fill="#475569">${v===0?"0":(v>0?"+":"−")+Math.abs(v).toFixed(1)}</text>`; });
    const rpx=(x0+pw*0.5).toFixed(1), rpy=yP(pt).toFixed(1), rtip=`累計粗利率差 ${(pt>=0?"+":"")+pt.toFixed(2)}pt（実績 ${(cr*100).toFixed(2)}%・予算 ${(br*100).toFixed(2)}%）`;
    g+=`<circle cx="${rpx}" cy="${rpy}" r="5" fill="${pt>=0?"#15803d":"#dc2626"}" stroke="#d62728" stroke-width="2"/>`+ptHit_(rpx,rpy,rtip,16);
  }
  g+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#cbd5e1"/>`;
  const label=`${fy}年度 ${+cur[0].ym.slice(4)}月〜${+cur[cur.length-1].ym.slice(4)}月（${nCur}ヶ月）の月平均`;
  g+=`<text x="${((x0+x1)/2).toFixed(1)}" y="${(y1+30).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="#475569">${esc(label)}</text>`;
  // タイトルは本体の凡例行と同じ高さ(16px)の別svgに出し、チャートsvg同士の縦位置（0線・軸）を揃える
  return `<svg viewBox="0 0 ${W} 18" style="width:100%;height:20px" role="img"><text x="0" y="13" font-size="12" fill="#334155">年度累計 予算対比</text></svg>`+
         `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">${g}</svg>`;
}
/** 本体チャート＋右横の累計チャートを横並びに（原本 columns([5,1]) 相当）。

}

function svgLoss_(rows, yoy){

/* 符号付き軸の枠（実データは減価償却の戻し等で負値が入る。0線を基準に上下へ描く） */
function chartBaseSigned_(rows, vals, leftTitle){
  const W=1000,H=430,mL=68,mR=24,mT=10,mB=58,x0=mL,x1=W-mR,y0=mT,y1=H-mB,ph=y1-y0,n=rows.length,bw=(x1-x0)/n;
  let mn=Math.min(0,...vals), mx=Math.max(0,...vals);
  mx=mx>0?niceMax(mx):1; mn=mn<0?-niceMax(-mn):0;
  const yL=v=>y1-((v-mn)/(mx-mn))*ph, cx=i=>x0+bw*(i+0.5), yz=yL(0);
  let g=""; const T=4;
  for(let t=0;t<=T;t++){ const val=mn+(mx-mn)*t/T,y=yL(val);
    g+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="${Math.abs(val)<1e-9?'#cbd5e1':'#eef2f7'}"/><text x="${x0-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="11" fill="#475569">${fmtK(val)}</text>`; }
  g+=`<text x="22" y="${(y0+ph/2).toFixed(1)}" transform="rotate(-90 22 ${(y0+ph/2).toFixed(1)})" text-anchor="middle" font-size="11.5" fill="#475569">${esc(leftTitle||"金額(千円)")}</text>`;
  g+=xMonthTicks_(rows,cx,y1);
  return {frame:g, yL, cx, x0, x1, y1, yz, bw, W, H, n};
}
/* YoY共通: 前年ゴースト＋当年（改善=不透明/悪化=淡）の棒。配置は yoyGeom_（原本 charts.py 準拠）に一本化。
   2系列=左右に並べて前年は同位置に細く重ねる／1系列=前年を左・当年を右へずらす。負値は0線から下へ。 */
function yoyPairBars_(b, rows, defs){
  let g="";
  rows.forEach((r,i)=>{
    g+=yoyBars_(b,i,defs.map(d=>({
      v:d.get(r)||0,
      prev:r.prev?(d.get(r.prev)||0):null,
      fill:d.color, name:d.label, ym:r.ym, lowerBetter:!!d.lowerBetter
    })));
  });
  return g;
}
/* ② ロス管理（前年対比）: 廃棄・値引の前年比＋改善pt折線（＋が改善=緑／−が悪化=赤） */
function svgLossYoY_(rows, C){
  let maxAmt=0, maxPt=0;
  rows.forEach(r=>{
    maxAmt=Math.max(maxAmt,r.waste_amount||0,r.discount_amount||0,r.prev?(r.prev.waste_amount||0):0,r.prev?(r.prev.discount_amount||0):0);
    if(r.prev){ maxPt=Math.max(maxPt, Math.abs(((r.prev.waste_rate||0)-(r.waste_rate||0))*100), Math.abs(((r.prev.discount_rate||0)-(r.discount_rate||0))*100)); }
  });
  const b=chartBase_(rows,{maxLeft:maxAmt,maxRight:(maxPt||1)*1.1,leftTitle:"金額(千円)",rightTitle:"改善pt"});
  let g=yoyPairBars_(b,rows,[
    {get:r=>r.waste_amount,    label:"廃棄額", color:C.waste, lowerBetter:true},
    {get:r=>r.discount_amount, label:"値引額", color:C.disc,  lowerBetter:true}
  ]);
  // 改善pt（前年率 − 当年率）: 0線を挟んで±。右軸は±maxPtの対称スケールに読み替える
  const yPt=v=>{ const mx=niceMax((maxPt||1)*1.1); const ph=(b.y1-10); return b.y1-((v+mx)/(2*mx))*ph; };
  const zero=yPt(0);
  g+=`<line x1="${b.x0}" y1="${zero.toFixed(1)}" x2="${b.x1}" y2="${zero.toFixed(1)}" stroke="#94a3b8" stroke-dasharray="4 4"/>`;
  const ptLine=(fn,col,label,rk)=>{ const pts=rows.map((r,i)=>r.prev?`${b.cx(i).toFixed(1)},${yPt(fn(r)).toFixed(1)}`:null).filter(Boolean).join(" ");
    let s=`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" opacity="0.8"/>`;
    rows.forEach((r,i)=>{ if(!r.prev)return; const v=fn(r), px=b.cx(i).toFixed(1), py=yPt(v).toFixed(1);
      const tip=`${r.ym} ${label}${v>0?"改善":"悪化"} ${(v>=0?"+":"")+v.toFixed(2)}pt（当年 ${((r[rk]||0)*100).toFixed(2)}%・前年 ${((r.prev[rk]||0)*100).toFixed(2)}%）`;
      s+=`<circle cx="${px}" cy="${py}" r="3.5" fill="${v>0?'#15803d':'#dc2626'}" stroke="${col}" stroke-width="1.5"/>`+ptHit_(px,py,tip,8); });
    return s; };
  g+=ptLine(r=>((r.prev.waste_rate||0)-(r.waste_rate||0))*100, C.waste, "廃棄率", "waste_rate");
  g+=ptLine(r=>((r.prev.discount_rate||0)-(r.discount_rate||0))*100, C.disc, "値引率", "discount_rate");
  return legendSvg_([[C.waste,"廃棄"],[C.disc,"値引"],["#cccccc","前年"],["#15803d","改善pt(＋)"]],b.x0,b.W)+svgWrap_(b,g);
}

/* ③個別費目（通常=単色棒／前年対比=ゴースト＋濃淡） */
function svgCostSingle_(rows, key, label, color, yoy){

const _XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

function busyOverlay_(show,title,sub){ let o=$("busyOverlay"); if(!show){ if(o)o.remove(); return; } if(!o){ o=document.createElement("div"); o.id="busyOverlay"; document.body.appendChild(o); } o.innerHTML=`<div class="bcard"><span class="spin"></span><div class="bttl">${esc(title||"処理中です")}</div><div class="bsub">${esc(sub||"画面を閉じずにお待ちください")}</div></div>`; }

function dmZone_(type,title,hint){
  return `<div class="dmzone"><h4>${esc(title)}</h4><p class="hint">${esc(hint)}</p>`+

function dmPick_(type,input){
  [...input.files].forEach(f=>{ if(!S.upQ.some(x=>x.type===type&&x.name===f.name&&x.size===f.size)) S.upQ.push({type,file:f,name:f.name,size:f.size,done:false}); });

}
function dmRenderQ_(){
  ["loss","budget"].forEach(type=>{

function dmDel_(type,i){ const items=S.upQ.filter(x=>x.type===type); const t=items[i]; S.upQ=S.upQ.filter(x=>x!==t); dmRenderQ_(); }
async function dmUpload_(){
  const items=S.upQ.filter(x=>!x.done);
  if(!items.length){ $("dmMsg").textContent="アップロードするファイルを選んでください"; return; }
  if(!IS_GAS){ $("dmMsg").textContent="ローカルではアップロードできません（本番でご利用ください）"; return; }
  const btn=$("dmUpBtn"); btn.disabled=true;
  busyOverlay_(true,"アップロード中です",`0 / ${items.length} 件`);
  let ok=0,ng=0;
  for(let i=0;i<items.length;i++){ const x=items[i];
    busyOverlay_(true,"アップロード中です",`${i+1} / ${items.length} 件目：${x.name}`);
    try{ await gsCall("uploadInbox", x.type, x.name, await fileB64_(x.file), _XLSX_MIME); x.done=true; ok++; }
    catch(e){ if(isSessionErr_(e)){ busyOverlay_(false); S.upQ=S.upQ.filter(q=>!q.done); return; } ng++; }   // 期限切れ: 残りは選んだまま残す（入り直してから送れる）
  }
  busyOverlay_(false); btn.disabled=false;

}

      return b;
    }
    case "span": { // 期間の帯: 24・12 か月の棒（濃い所が表示する期間）・ytd＝4月から基準月まで
      const s=gEl("span","gui-span"), n=36, on=v==="ytd"?8:Number(v)||0;
      for(let i=0;i<n;i++){ const x=gEl("i", i>=n-on?(v==="ytd"?"ytd":"hl"):""); x.style.height=(10+((i*5)%16))+"px"; s.append(x); }
      return s;
    }
    default: return gEl("span","",v);
  }
}
function gNum_(n){ const c=gEl("span","gnum",n); c.setAttribute("aria-hidden","true"); return c; }
function gFlow_(f, steps){
  const box=gEl("div", f.kind==="flow"?"gflow":"gflow gcards"), list=gEl("ol","gflow-list");
  steps.forEach((s,i)=>{ const li=gEl("li","gflow-step"); li.append(gNum_(i+1));
    const u=f.ui&&f.ui[i]; if(u){ const w=gEl("span","gflow-ui"); w.setAttribute("aria-hidden","true"); w.append(gUi_(u[0],u[1])); li.append(w); }
    li.append(gEl("strong","",s.h)); if(s.t) li.append(gEl("span","gflow-t",s.t)); list.append(li); });
  box.append(list); return box;
}
/* 写真＋番号の丸（丸の位置は％なので、どの大きさでもずれない）。丸か手順にさわると、同じ番号の枠が光る */
function gShot_(f){
  const fig=gEl("figure","gshot"); fig.style.setProperty("--gw", f.w+"px");
  const sc=gEl("div","gshot-scroll"), fr=gEl("div","gshot-frame"), img=gEl("img");
  img.alt=String(f.alt||""); img.width=f.w; img.height=f.h; img.loading="lazy"; img.decoding="async"; img.src=f.src; fr.append(img);
  (f.marks||[]).forEach((m,i)=>{ const n=String(i+1);
    const b=gEl("span","gbox"); b.dataset.n=n; b.style.left=m[2]+"%"; b.style.top=m[3]+"%"; b.style.width=m[4]+"%"; b.style.height=m[5]+"%";
    const c=gNum_(n); c.classList.add("gmark"); c.dataset.n=n; c.style.left=m[0]+"%"; c.style.top=m[1]+"%"; fr.append(b,c); });
  sc.append(fr); fig.append(sc);
  const cap=gEl("figcaption","gcap"); cap.append(gEl("span","","見本の写真（作り物のデータ）"));
  if(f.w>640){ const z=gEl("button","btn gzoom","大きく見る"); z.type="button"; z.style.cssText="padding:2px 10px;font-size:12px";
    z.addEventListener("click",()=>{ const on=fig.classList.toggle("zoom"); z.textContent=on?"画面の幅に戻す":"大きく見る"; }); cap.append(z); }
  fig.append(cap); return fig;
}
function gSteps_(steps){
  const ol=gEl("ol","gsteps");
  steps.forEach((s,i)=>{ const li=gEl("li"); li.dataset.n=String(i+1); li.append(gNum_(i+1), gEl("strong","",s.h)); if(s.t) li.append(gEl("span","",s.t)); ol.append(li); });
  return ol;
}
function gHot_(sec){
  const set=n=>sec.querySelectorAll("[data-n]").forEach(x=>x.classList.toggle("hot", x.dataset.n===n));
  sec.addEventListener("mouseover",e=>{ const t=e.target.closest("[data-n]"); set(t?t.dataset.n:""); });
  sec.addEventListener("mouseleave",()=>set(""));
  sec.addEventListener("click",e=>{ const t=e.target.closest(".gmark, .gsteps li"); if(t) set(t.dataset.n); });
}
/* 写真の一覧（figs.js）は、ガイドを開いたときに1回だけ読む */
let _gFigsP=null;
function loadGuideFigs_(){
  if(window.GUIDE_SHOTS) return Promise.resolve(window.GUIDE_SHOTS);
  if(_gFigsP) return _gFigsP;
  _gFigsP=new Promise(res=>{ const s=document.createElement("script"); s.src="guide-img/figs.js?v="+encodeURIComponent(buildId_()); s.async=true;
    s.onload=()=>res(window.GUIDE_SHOTS||{}); s.onerror=()=>{ _gFigsP=null; res({}); }; document.head.appendChild(s); });
  return _gFigsP;
}
function gFigOf_(name, shots){
  if(Object.prototype.hasOwnProperty.call(GUIDE_FIGS,name)) return GUIDE_FIGS[name];
  const s=shots&&Object.prototype.hasOwnProperty.call(shots,name)?shots[name]:null;
  if(s && /^guide-img\/[a-z0-9-]+\.png(\?v=[0-9a-f]+)?$/.test(String(s.src))) return Object.assign({kind:"shot"}, s);
  return null;
}

/* ── 目次と本文の連動・移動の履歴（ひとつ前に戻る・TOP） ── */
let _gHist=[], _gForce=null, _gAnim=null;
const gBody_=()=>document.querySelector("#guide .gbody");
function gSetBack_(){ const b=document.getElementById("gBack"); if(b) b.disabled=!_gHist.length; }
/* 滑らせて着地させる。target（節）を渡したときは、行き先を毎回測り直す（画面の外の節は、近づいて描いたときに大きさが変わる＝content-visibility） */
function gScrollTo_(to, landEl, target){
  const gb=gBody_(); if(!gb) return;
  if(_gAnim) cancelAnimationFrame(_gAnim);
  const dest=()=>target ? Math.max(0, gb.scrollTop+(target.getBoundingClientRect().top-gb.getBoundingClientRect().top)-8) : to;
  const land=()=>{ if(landEl){ landEl.classList.remove("landing"); void landEl.offsetWidth; landEl.classList.add("landing"); } gSpy_(); };
  const settle=()=>{ if(target) [60,180,400].forEach(ms=>setTimeout(()=>{ if(_gForce===target.id){ const d=dest(); if(Math.abs(gb.scrollTop-d)>1) gb.scrollTop=d; gSpy_(); } }, ms)); };   // 着いてから描いた分のずれを直す（自分で送ったらやめる）
  if(document.visibilityState==="hidden"){ gb.scrollTop=dest(); land(); settle(); return; }   // 裏のタブでは rAF が動かない＝すぐ移す
  const from=gb.scrollTop, t0=performance.now(), dur=Math.min(650, Math.max(280, Math.abs(dest()-from)*0.25));
  const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2; gb.scrollTop=from+(dest()-from)*e; gSpy_(); if(p<1) _gAnim=requestAnimationFrame(step); else { _gAnim=null; land(); settle(); } };
  _gAnim=requestAnimationFrame(step);
  setTimeout(()=>{ if(_gAnim){ cancelAnimationFrame(_gAnim); _gAnim=null; gb.scrollTop=dest(); land(); settle(); } }, dur+120);   // 保険: rAF が止められても必ず着地
}
function gJump_(id){
  const el=document.getElementById(id), gb=gBody_(); if(!el||!gb) return false;
  _gHist.push(gb.scrollTop); gSetBack_(); _gForce=id;
  gScrollTo_(0, el, el);
  return false;
}
function gTop_(){ const gb=gBody_(); if(!gb) return; _gHist.push(gb.scrollTop); gSetBack_(); _gForce=null; gScrollTo_(0, gb.querySelector(".gsec")); }
function gBack_(){ if(!_gHist.length) return; const to=_gHist.pop(); gSetBack_(); _gForce=null; gScrollTo_(to, null); }
function gSpy_(){
  const body=gBody_(); if(!body) return;
  const secs=[...body.querySelectorAll(".gsec")]; if(!secs.length) return;
  const top=body.getBoundingClientRect().top+24; let cur=secs[0].id;
  if(_gForce && document.getElementById(_gForce)) cur=_gForce;
  else if(body.scrollTop+body.clientHeight>=body.scrollHeight-4) cur=secs[secs.length-1].id;
  else secs.forEach(s=>{ if(s.getBoundingClientRect().top<=top) cur=s.id; });
  document.querySelectorAll("#guide .gnav a").forEach(a=>{ const on=a.dataset.gid===cur; a.classList.toggle("on",on);
    if(on){ const nav=a.parentElement; if(nav.scrollHeight>nav.clientHeight+1){ const r=a.getBoundingClientRect(), nr=nav.getBoundingClientRect(); if(r.top<nr.top||r.bottom>nr.bottom) nav.scrollTop+=r.top-nr.top-nav.clientHeight/3; }
      if(nav.scrollWidth>nav.clientWidth+1) nav.scrollLeft=a.offsetLeft-(nav.clientWidth-a.offsetWidth)/2; } });
}

/* ガイドを描く。g: "loading"／null（窓口につながっていない）／{error}／{guides:[…]}。key＝見る人向け・管理者向けのどちら */
function renderGuide_(g, key){
  closeGuide();
  const el=gEl("div"); el.id="guide";
  const card=gEl("div","gcard"), head=gEl("div","ghead");
  head.append(gEl("h2","",GUIDE_NAME));
  const guides=(g&&Array.isArray(g.guides))?g.guides.filter(x=>x&&Array.isArray(x.sections)&&typeof x.label==="string"):[];
  const cur=guides.find(x=>x.key===key)||guides[0]||null;
  if(guides.length>1){ const sw=gEl("div","gfor"); sw.setAttribute("role","tablist"); sw.setAttribute("aria-label","だれ向けのガイド");
    guides.forEach(x=>{ const b=gEl("button",x===cur?"on":"",x.label); b.type="button"; b.setAttribute("role","tab"); b.setAttribute("aria-selected",String(x===cur)); b.addEventListener("click",()=>{ if(x!==cur) renderGuide_(g, x.key); }); sw.append(b); });
    head.append(sw); }
  const mv=gEl("div","gmove");
  const back=gEl("button","btn","← ひとつ前に戻る"); back.type="button"; back.id="gBack"; back.disabled=true; back.addEventListener("click",gBack_);
  const top=gEl("button","btn","↑ TOPに戻る"); top.type="button"; top.addEventListener("click",gTop_);
  const close=gEl("button","btn gclose","閉じる"); close.type="button"; close.addEventListener("click",closeGuide);
  mv.append(back,top,close); head.append(mv); card.append(head);
  _gHist=[]; _gForce=null;
  if(g==="loading"){ const n=gEl("div","note"); n.style.cssText="padding:40px;text-align:center"; n.append(gEl("span","spin"), gEl("div","","利用ガイドを読み込んでいます…")); card.append(n); }
  else if(!g){ card.append(gEl("div","note","利用ガイドは、会社のアカウントでログインすると表示されます。")); }
  else if(g.error){ const n=gEl("div","err","利用ガイドを読み込めませんでした: "+g.error+"　時間をおいて、もう一度お試しください。"); n.style.margin="20px"; card.append(n); }
  else if(cur){
    const wrap=gEl("div","gwrap"), nav=gEl("nav","gnav"), body=gEl("div","gbody");
    nav.setAttribute("aria-label","目次");
    const shots=window.GUIDE_SHOTS||{};
    cur.sections.forEach((s,i)=>{
      const id="g-"+String(s.id||"").replace(/[^a-z0-9-]/gi,""); if(id==="g-") return;
      const a=gEl("a","",(i+1)+". "+s.title); a.href="#"+id; a.dataset.gid=id; a.addEventListener("click",e=>{ e.preventDefault(); gJump_(id); }); nav.append(a);
      const sec=gEl("section","gsec"); sec.id=id; const h=gEl("h3","",s.title); h.dataset.n=String(i+1); sec.append(h);
      const steps=(Array.isArray(s.steps)?s.steps:[]).filter(x=>x&&typeof x.h==="string").map(x=>({h:x.h,t:typeof x.t==="string"?x.t:""}));
      const f=gFigOf_(s.fig, shots);
      if(f && (f.kind==="flow"||f.kind==="cards")) sec.append(gFlow_(f, steps));
      else if(f && f.kind==="shot"){ const pair=gEl("div","gpair"+(f.w<=640||(f.w<=1000&&f.w/f.h<1.6)?" side":"")); pair.append(gShot_(f)); if(steps.length) pair.append(gSteps_(steps)); sec.append(pair); gHot_(sec); }
      else if(steps.length) sec.append(gSteps_(steps));
      const items=(Array.isArray(s.items)?s.items:[]).filter(x=>typeof x==="string"&&x);
      if(items.length){ const ul=gEl("ul","gnotes"); items.forEach(t=>ul.append(gEl("li","",t))); sec.append(ul); }
      body.append(sec);
    });
    wrap.append(nav, body); card.append(wrap);
    body.addEventListener("scroll", gSpy_, {passive:true});
    ["wheel","touchstart","keydown","mousedown"].forEach(ev=>body.addEventListener(ev,()=>{ _gForce=null; if(_gAnim){ cancelAnimationFrame(_gAnim); _gAnim=null; } },{passive:true}));   // 自分で送ったら、滑らせるのをやめて現在地を追う
  }
  el.append(card);
  el.addEventListener("click",e=>{ if(e.target===el) closeGuide(); });
  document.body.appendChild(el);
  gSpy_();
}
async function openGuide(key){
  if(!GAS_READY){ renderGuide_(null); return; }                 // 窓口につながっていない（ローカル・デモ）: 案内だけ（本文は配らない）
  if(S.guideData){ await loadGuideFigs_(); renderGuide_(S.guideData, key); return; }   // 開いている間は覚えて使い回す（入り直し・ログアウトで捨てる）
  renderGuide_("loading");
  try{
    const [g]=await Promise.all([gsCall("getGuide"), loadGuideFigs_()]);   // 本文と写真の一覧を同時に
    S.guideData=g; renderGuide_(g, key);
  }catch(e){ if(isSessionErr_(e)){ closeGuide(); return; } renderGuide_({error:String(e&&e.message||e)}); }   // 期限切れはログインの画面だけ（お知らせを重ねない）
}
function closeGuide(){ const g=$("guide"); if(g) g.remove(); if(_gAnim){ cancelAnimationFrame(_gAnim); _gAnim=null; } }

/* ポータル等からの直リンク（?guide=1）: 起動・ログインのあとに1回だけ開く（初めてのログインでも開く）。開いたら印を外す（開き直しのたびに出さない） */
function autoGuide_(){
  if(!/[?&]guide=1(&|$)/.test(location.search)) return;
  try{ const u=new URL(location.href); u.searchParams.delete("guide"); history.replaceState(null,"",u.pathname+(u.search||"")+u.hash); }catch(e){}
  openGuide();
}
async function boot(){
  if(IS_LOCAL){ S.isAdmin=true; await startApp_(); autoGuide_(); return; }   // ローカル: 認証なし・モック・管理者扱いでUI確認
  if(!GAS_READY){
    $("app").innerHTML=`<div class="card"><div class="cico">🛠️</div><h3>部門損益 可視化（GitHub＋GAS 版・準備中）</h3>`+
      `<p>画面（3つの分析モード＋入口ウィザード）は実装済みです。<br>バックエンド（soneki-gas）のデプロイ URL を設定すると、会社アカウントのログインと実データ表示が有効になります。</p>`+
      `<div class="roadmap"><b>現在の状態</b><ul>`+
      `<li>総合分析（通常24ヶ月／前年対比12ヶ月＋累計） ✅ 実装済</li><li>比較・内訳（3つの比べ方×10チャート） ✅ 実装済</li><li>予算対比 … 年度予算Excelの取込後に有効</li>`+
      `</ul></div>`+
      `<div style="margin-top:16px"><button class="btn primary" onclick="startDemo_()">▶ サンプルデータで表示を見る（デモ）</button>`+
      `<p class="lb" style="margin-top:6px">実データは本部取込後に表示されます。デモは色・見せ方の確認用です。</p></div></div>`;
    autoGuide_();                                  // 未接続でも ?guide=1 は案内を表示（本文は本番接続後）
    return;
  }
  try{ localStorage.removeItem("soneki_oauth_token_v1"); }catch(e){}   // 前の版が残した Google の札（1時間）を端末に残さない
  session = readSession_();
  if(!session){                                     // 札が無い・切れている: ログインの画面（Google の窓を勝手に開かない）
    const expired = hadExpiredSession_(); clearSession_();
    if(expired){ sessionNoticeShown=true; renderLogin_(SESSION_MSG, "info"); } else renderLogin_();   // 7日が過ぎた札があった: なぜ聞かれるかを1回だけ添える
    return;
  }
  showUser_(session.email);
  await startApp_({ who:true });                    // 札で開く: だれか・管理者かと、表示のデータを同時に取りに行く
  if(S.meta) autoGuide_();
}
boot();
</script>
