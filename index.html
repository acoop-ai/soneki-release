<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- 多層防御(第零条実践規範§7-4): 出口封鎖CSP。Hissuru と同一（GAS も accounts/googleusercontent も同ホスト）。 -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://accounts.google.com https://apis.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com">

<style>
  :root{ --border:#e2e8f0; --muted:#64748b; --fg:#0f172a; --sky50:#f0f9ff; --sky100:#e0f2fe; --sky700:#0369a1; --sky800:#075985; --amber:#b45309;
         /* オリジナル(DeptProfitVis charts.py)準拠の配色 */
         --sales:#1f77b4; --gp:#ff7f0e; --rate:#d62728; --salesL:#a6c8e0; --gpL:#ffcc80; --rateL:#e57373;
         --waste:#d62728; --discount:#C71585; --loss:#FFAB00; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Segoe UI","Hiragino Sans","Yu Gothic UI",sans-serif;color:var(--fg);background:#fff;}
  header{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;}
  header .logo{background:#f39800;color:#fff;font-weight:700;font-size:12px;border-radius:6px;padding:5px 7px;}
  header h1{font-size:15px;margin:0;} header .sub{font-size:11px;color:var(--muted);font-weight:400;}
  header .user{margin-left:auto;font-size:11px;color:var(--muted);}
  header .ghelp{margin-left:10px;padding:4px 10px;font-size:12px;white-space:nowrap;border:1px solid var(--sky700);border-radius:8px;color:var(--sky800);background:var(--sky50);font-weight:600;cursor:pointer;}
  .page{min-height:calc(100vh - 55px);}
  main{max-width:1160px;margin:0 auto;padding:18px 16px 40px;}
  h2.title{font-size:20px;font-weight:600;margin:0;} .subtitle{font-size:13px;color:var(--muted);margin:2px 0 0;}
  .btn{border:1px solid var(--border);border-radius:8px;background:#fff;cursor:pointer;font-size:13px;padding:6px 12px;color:#334155;}
  .btn.primary{background:#f39800;border-color:#f39800;color:#fff;font-weight:600;}
  select{font-size:13px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;background:#fff;}
  .lb{font-size:11px;color:var(--muted);}
  .note{color:var(--muted);font-size:13px;padding:14px;}
  .err{color:#b91c1c;font-size:13px;padding:14px;border:1px solid #fecaca;border-radius:10px;background:#fef2f2;white-space:pre-wrap;}
  .card{border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:22px;max-width:520px;margin:6vh auto 0;text-align:center;}
  .card .cico{font-size:30px;} .card h3{margin:8px 0 4px;font-size:17px;} .card p{color:var(--muted);font-size:13px;margin:6px 0 16px;}
  .roadmap{border:1px solid var(--sky100);background:var(--sky50);border-radius:12px;padding:14px 18px;margin-top:16px;text-align:left;}
  .roadmap b{color:var(--sky800);} .roadmap ul{margin:8px 0 0 18px;padding:0;} .roadmap li{font-size:13px;line-height:1.8;color:#334155;}
  .badge{display:inline-block;background:#fffbeb;border:1px solid #fde68a;color:var(--amber);font-size:11px;font-weight:700;border-radius:6px;padding:2px 8px;}
  .selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:10px 0 6px;}
  .modeseg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .modeseg button{border:none;background:#fff;padding:6px 12px;font-size:13px;cursor:pointer;color:#334155;}
  .modeseg button.on{background:#f39800;color:#fff;font-weight:600;}
  .wcard{border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04);padding:20px 22px;margin-top:14px;}
  .wq{margin:10px 0 16px;} .wqt{font-size:14px;font-weight:700;margin-bottom:8px;color:#0f172a;}
  .wopts{display:flex;flex-wrap:wrap;gap:8px;}
  .wbtn{border:1.5px solid var(--border);border-radius:10px;background:#fff;cursor:pointer;font-size:13.5px;padding:9px 14px;color:#334155;}
  .wbtn:hover{border-color:#f39800;background:#fff7ed;}
  .wbtn.on{border-color:#f39800;background:#f39800;color:#fff;font-weight:700;}
  .chartcard{border:1px solid var(--border);border-radius:12px;background:#fff;padding:12px 14px;margin-top:8px;}
  .chartcard .chead{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .chartcard .chead b{font-size:14px;} .chartcard .chead .lb{font-size:11px;}
  .scopechips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 0;}
  .chip{font-size:11px;border-radius:999px;padding:2px 9px;background:#eef2f7;color:#475569;}
  .chip.a{background:#e0f2fe;color:#075985;} .chip.s{background:#dcfce7;color:#166534;} .chip.d{background:#ede9fe;color:#5b21b6;}
  svg text{font-family:"Segoe UI","Hiragino Sans",sans-serif;}
  .admin-btn{border:1px solid #f59e0b;background:#fffbeb;color:#92400e;font-weight:700;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;}
  #busyOverlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center;z-index:200;}
  #busyOverlay .bcard{background:#fff;border-radius:14px;padding:18px 24px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:center;min-width:240px;}
  #busyOverlay .bttl{font-weight:700;font-size:14px;margin-top:10px;color:#0f172a;} #busyOverlay .bsub{font-size:12px;color:var(--muted);margin-top:4px;}
  .spin{display:inline-block;width:22px;height:22px;border:3px solid #e2e8f0;border-top-color:#f39800;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* ── ご利用ガイド: 全システム共通の標準レイアウト（サイド目次＋メイン本文・双方向連動） ──
     既定形: 左=目次(sticky)／右=本文。本文スクロールで目次をハイライト(scroll-spy)、目次クリックで本文へスクロール。
     用途により「ヘッダタブで粗く切替」「小見出しごとに本文差し替え」も可（本CSSはその土台も兼ねる）。 */
  #guide{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;}
  #guide .gcard{background:#fff;border-radius:14px;width:100%;max-width:1040px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.28);overflow:hidden;}
  #guide .ghead{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);flex:none;}
  #guide .ghead h2{font-size:16px;margin:0;} #guide .ghead .gsub{font-size:11px;color:var(--muted);}
  #guide .gclose{margin-left:auto;}
  #guide .gwrap{display:flex;min-height:0;flex:1;}
  #guide .gnav{width:232px;flex:none;border-right:1px solid var(--border);background:#f8fafc;overflow:auto;padding:10px 0 18px;}
  #guide .gnav a{display:block;padding:7px 14px 7px 16px;font-size:12.5px;line-height:1.5;color:#475569;text-decoration:none;border-left:3px solid transparent;}
  #guide .gnav a:hover{background:#eef2f7;color:var(--sky800);}
  #guide .gnav a.on{background:#e0f2fe;color:var(--sky800);font-weight:700;border-left-color:var(--sky700);}
  #guide .gnav a.sub{padding-left:30px;font-size:12px;color:#64748b;}
  /* scroll-behavior:smooth は付けない（コンテナに付けるとプログラム的スクロールが効かない環境がある）。JS側で scrollTo(behavior) を明示する */
  #guide .gbody{flex:1;min-width:0;overflow:auto;padding:14px 24px 40px;}
  #guide h3{font-size:14.5px;margin:22px 0 6px;color:var(--sky800);border-left:4px solid var(--sky700);padding-left:8px;scroll-margin-top:12px;}
  #guide h3:first-child{margin-top:4px;}
  #guide h4{font-size:13px;margin:14px 0 4px;color:#334155;scroll-margin-top:12px;}
  #guide p,#guide li{font-size:13px;line-height:1.75;color:#334155;margin:4px 0;}
  #guide ul,#guide ol{margin:4px 0 6px 20px;padding:0;}
  #guide .gnote{background:var(--sky50);border:1px solid var(--sky100);border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.7;color:var(--sky800);margin:8px 0;}
  #guide .gwarn{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 12px;font-size:12.5px;line-height:1.7;color:#92400e;margin:8px 0;}
  #guide .gadmin{display:inline-block;background:#fffbeb;border:1px solid #f59e0b;color:#92400e;font-size:10px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
  #guide table{border-collapse:collapse;width:100%;margin:8px 0;font-size:12.5px;}
  #guide th,#guide td{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top;}
  #guide th{background:#f8fafc;white-space:nowrap;}
  #guide .sw{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:middle;margin-right:5px;}
  @media (max-width:760px){
    #guide .gwrap{flex-direction:column;}
    #guide .gnav{width:auto;max-height:132px;border-right:none;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px;padding:8px 10px;}
    #guide .gnav a{border-left:none;border-radius:999px;padding:4px 10px;background:#fff;border:1px solid var(--border);}
    #guide .gnav a.on{border-color:var(--sky700);} #guide .gnav a.sub{display:none;}
  }
  @media print{
    #guide{position:static;background:#fff;padding:0;} #guide .gcard{max-height:none;box-shadow:none;border-radius:0;}
    #guide .gnav,#guide .gclose{display:none !important;} #guide .gbody{overflow:visible;}
    body>header,body>.page{display:none !important;}
  }
  .dmcard{max-width:760px;margin:12px auto;border:1px solid var(--border);border-radius:12px;padding:18px 20px;}
  .dmzone{border:1.5px dashed var(--border);border-radius:10px;padding:14px;margin:12px 0;background:#fafafa;}
  .dmzone h4{margin:0 0 4px;font-size:14px;} .dmzone .hint{font-size:12px;color:var(--muted);margin:0 0 8px;}
  .uplist{margin-top:8px;} .uprow{font-size:12px;padding:3px 0;color:#334155;display:flex;gap:6px;align-items:center;}
  .uprow .st{width:18px;text-align:center;} .uprow .x{margin-left:auto;cursor:pointer;color:#94a3b8;}
</style>

<body>
<header>
  <span class="logo">AC</span>
  <div><h1>部門損益 可視化 <span class="sub">DeptProfit・build soneki-web-2026-07-29e</span></h1></div>
  <span class="user" id="user"></span>
  <button class="btn ghelp" onclick="openGuide()" title="このシステムの使い方">📖 ご利用ガイド</button>
</header>
<div class="page" id="page">
<main id="app"><div class="note">読み込み中…</div></main>
</div>

<script>
"use strict";
/* 部門損益 可視化（soneki）。ヒッスル(PDCA)は別の第3システム（混同禁止）。
   構成: 画面=GitHub Pages ／ データ=GAS API（毎回トークン検証）。Hissuru の型を流用。 */
const IS_LOCAL = (location.hostname==="localhost"||location.hostname==="127.0.0.1"||location.protocol==="file:");
const IS_GAS = !IS_LOCAL;
const CONFIG = {
  GAS_URL: "https://script.google.com/macros/s/AKfycbwtA1LmZwtb2sef-R5XufrxiceE_i3tW6hk9BbhMfuzplX2wxyTiw3upKLDLZUGQbg/exec",   // soneki-gas デプロイ後に /exec URL へ差し替え
  GOOGLE_CLIENT_ID: "1072945615483-74jadmaet56chvhkfh2cpt4ae9dvh140.apps.googleusercontent.com", // Hissuru と共用（同一オリジン）
  ALLOWED_DOMAINS: ["jaz-acoop.co.jp","jaz-acoop1.jp","jaz-acoop2.jp","jaz-acoop3.jp"]
};
const GAS_READY = IS_GAS && CONFIG.GAS_URL.indexOf("http")===0;

/* ── OAuth2 認証（Hissuru/スマレコ方式） ── */
let currentAccessToken=null, accessTokenExpiry=0, oauthTokenClient=null, tokenRefreshTimer=null, authedEmail="";
const TOKEN_STORE_KEY = "soneki_oauth_token_v1";
function persistAccessToken_(){ try{ if(currentAccessToken&&accessTokenExpiry) localStorage.setItem(TOKEN_STORE_KEY, JSON.stringify({t:currentAccessToken,e:accessTokenExpiry})); }catch(e){} }
function restoreAccessToken_(){ try{ const raw=localStorage.getItem(TOKEN_STORE_KEY); if(!raw) return false; const o=JSON.parse(raw); if(!o||!o.t||!o.e||Date.now()>o.e-60000) return false; currentAccessToken=o.t; accessTokenExpiry=o.e; scheduleAccessTokenRefresh_(Math.floor((o.e-Date.now())/1000)+30); return true; }catch(e){ return false; } }
function clearStoredToken_(){ try{ localStorage.removeItem(TOKEN_STORE_KEY); }catch(e){} }
function ensureOAuthTokenClient_(){
  if(oauthTokenClient) return;
  if(!(window.google && google.accounts && google.accounts.oauth2)) throw new Error("Googleログイン部品が読み込めていません。ページを再読み込みしてください");
  oauthTokenClient = google.accounts.oauth2.initTokenClient({ client_id: CONFIG.GOOGLE_CLIENT_ID, scope: "openid email profile", callback: ()=>{} });
}
function requestAccessTokenOnce_(opts){
  return new Promise((resolve,reject)=>{
    try{ ensureOAuthTokenClient_(); }catch(e){ return reject(e); }
    const silent = !!(opts && opts.silent);
    let settled=false, guard=null;
    if(silent) guard=setTimeout(()=>{ if(!settled){ settled=true; reject(new Error("silent token timeout")); } }, 10000);
    oauthTokenClient.callback = (resp)=>{
      if(settled) return; settled=true; if(guard) clearTimeout(guard);
      if(!resp || resp.error || !resp.access_token) return reject(new Error((resp&&(resp.error_description||resp.error))||"トークン取得失敗"));
      currentAccessToken = resp.access_token;
      const ei = Number(resp.expires_in)||3600;
      accessTokenExpiry = Date.now() + (ei-30)*1000;
      persistAccessToken_(); scheduleAccessTokenRefresh_(ei);
      resolve(resp);
    };
    try{ const req={}; if(silent) req.prompt=""; oauthTokenClient.requestAccessToken(req); }
    catch(e){ if(!settled){ settled=true; if(guard) clearTimeout(guard); reject(e); } }
  });
}
function scheduleAccessTokenRefresh_(expiresInSec){
  if(tokenRefreshTimer) clearTimeout(tokenRefreshTimer);
  const after = Math.min(Math.max((expiresInSec-300)*1000, 5000), 55*60*1000);
  tokenRefreshTimer = setTimeout(()=>{ requestAccessTokenOnce_({silent:true}).catch(()=>{}); }, after);
}
async function fetchUserInfo_(){
  if(!currentAccessToken) throw new Error("未ログイン");
  const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", { headers:{ Authorization: "Bearer "+currentAccessToken } });
  if(!res.ok) throw new Error("userinfo HTTP "+res.status);
  return res.json();
}
async function gsCall(fn, ...args){
  if(!GAS_READY) throw new Error("GAS_URL 未設定");
  const noToken = !currentAccessToken, near = accessTokenExpiry && Date.now() > accessTokenExpiry - 60000;
  if(noToken || near){ try{ await requestAccessTokenOnce_({silent:true}); }catch(e){} }
  if(!currentAccessToken){ renderLogin_("セッションの有効期限が切れました。再度ログインしてください。"); throw new Error("セッション切れです"); }
  const res = await fetch(CONFIG.GAS_URL, { method:"POST", headers:{ "Content-Type":"text/plain;charset=UTF-8" }, body: JSON.stringify({ action:fn, args:args, accessToken: currentAccessToken }), redirect:"follow" });
  if(!res.ok) throw new Error("HTTP "+res.status);
  const json = await res.json();
  if(json && json.error){ if(String(json.error).indexOf("認証失敗")>=0){ currentAccessToken=null; accessTokenExpiry=0; clearStoredToken_(); } throw new Error(json.error); }
  return json.result;
}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ── データ取得: デモ=同梱demo/ ／ 本番=GAS getJson ／ ローカル=outbox_mirror ── */
let DEMO=false;
async function loadJson(name){
  if(DEMO){ const r=await fetch("demo/"+name); if(!r.ok) throw new Error("未収載: "+name); return r.json(); }
  if(IS_GAS) return JSON.parse(await gsCall("getJson", name));
  const r=await fetch("../outbox_mirror/"+name); if(!r.ok) throw new Error("未収載: "+name); return r.json();
}
async function startDemo_(){ DEMO=true; S.isAdmin=false; $("user").textContent="デモ表示（サンプルデータ）"; await startApp_(); }

/* ── 状態 ── */
const S={ meta:null,
  view:"wizard",                                 // wizard=入口ウィザード ／ dash=分析画面
  mode:"総合",                                    // 総合 ／ 比較 ／ 予算（3分析モード）
  sub:"通常",                                     // 通常 ／ 前年対比（総合・比較で有効。窓=24／12+累計）
  area:"", scope:"AREA", dept:"ALL",              // 総合分析・予算対比の対象
  baseYm:"",                                      // 基準月（表示窓の末尾。空=最新月。PO要望 2026-07-29）
  comp:{ kind:"AREAS", area:"", store:"", dept:"ALL", chart:"①" },  // 比較・内訳の条件
  wiz:{ step:1, kind:null, area:null, store:null },                   // ウィザード進行
  series:null, isAdmin:false, upQ:[] };
const aslug_=a=>{ const x=(S.meta.areas||[]).find(o=>o.name===a); return x?x.slug:a; };
const dslug_=d=>{ if(d==="ALL")return "ALL"; const x=(S.meta.depts||[]).find(o=>o.name===d); return x?x.slug:d; };

/* ── 画面: ログイン ── */
function renderLogin_(msg){
  $("user").textContent="";
  $("app").innerHTML=
    `<div class="card"><div class="cico">🔐</div><h3>会社アカウントでログイン</h3>`+
    `<p>会社の Google アカウント（jaz-acoop.co.jp ／ jaz-acoop1.jp ／ jaz-acoop2.jp ／ jaz-acoop3.jp）でログインしてください。個人の Gmail では開けません。</p>`+
    (msg?`<p class="err" style="text-align:left">${esc(msg)}</p>`:"")+
    `<button class="btn primary" style="padding:9px 18px" onclick="login_()">Google でログイン</button></div>`;
}
async function login_(){ try{ await requestAccessTokenOnce_({}); await afterAuth_(); }catch(e){ renderLogin_("ログインに失敗しました：" + (e&&e.message||e)); } }
function logout_(){ currentAccessToken=null; accessTokenExpiry=0; authedEmail=""; clearStoredToken_(); renderLogin_(); }
async function afterAuth_(){
  try{
    const info = await fetchUserInfo_();
    authedEmail = String(info.email||"").toLowerCase();
    if(CONFIG.ALLOWED_DOMAINS.indexOf(authedEmail.split("@")[1]||"")<0){ logout_(); renderLogin_("会社アカウント（4ドメイン）でログインし直してください。"); return; }
    $("user").innerHTML = `${esc(authedEmail)} <button class="btn" style="padding:2px 8px;font-size:11px;margin-left:6px" onclick="logout_()">ログアウト</button>`;
  }catch(e){ renderLogin_("ユーザー情報の取得に失敗しました。再度ログインしてください。"); return; }
  try{ const w=await gsCall("whoami"); S.isAdmin=!!(w&&w.isAdmin); }catch(e){ S.isAdmin=false; }
  await startApp_();
}

/* ── アプリ本体 ── */
async function startApp_(){
  try{ S.meta = await loadJson("meta.json"); }
  catch(e){ $("app").innerHTML=`<div class="err">データ（meta.json）を取得できません：${esc(String(e&&e.message||e))}</div>`; return; }
  S.area = (S.meta.areas[0]||{}).name || "";
  S.wiz={ step:1, kind:null, area:null, store:null };
  renderWizard_();                                // スコープ先行: 最初に見たい範囲を選んでから表示
}
function storesOfArea_(area){ return (S.meta.stores||[]).filter(s=>s.area===area); }
function demoBanner_(){ return DEMO?`<div style="background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:8px;padding:8px 12px;font-size:12.5px;margin-bottom:8px">🧪 これは<b>サンプルデータのデモ表示</b>です（実データではありません）。色・見せ方の確認用。実データは本部取込後に表示されます。</div>`:""; }

/* ── 入口ウィザード（スコープ先行: Q1範囲 → Q2対象 → Q3部門 → 表示。原本の「フィルタから探す」を反転） ── */
function renderWizard_(){
  S.view="wizard"; const w=S.wiz;
  let q1=`<div class="wq"><div class="wqt">Q1. どの範囲を見ますか？</div><div class="wopts">`+
    `<button class="wbtn ${w.kind==="AREA"?"on":""}" onclick="wizKind_('AREA')">🗺️ エリア全体（エリア合計）</button>`+
    `<button class="wbtn ${w.kind==="STORE"?"on":""}" onclick="wizKind_('STORE')">🏬 店舗ごと</button>`+
    `</div></div>`;
  let q2="";
  if(w.step>=2){
    const areaBtns=S.meta.areas.map(a=>`<button class="wbtn ${w.area===a.name?"on":""}" onclick="wizArea_('${esc(a.name)}')">${esc(a.name)}</button>`).join("");
    q2=`<div class="wq"><div class="wqt">Q2. ${w.kind==="AREA"?"どのエリアを見ますか？":"どの店舗を見ますか？（エリア → 店舗）"}</div><div class="wopts">${areaBtns}</div>`;
    if(w.kind==="STORE" && w.area){
      q2+=`<div class="wopts" style="margin-top:8px">`+storesOfArea_(w.area).map(s=>`<button class="wbtn ${w.store===s.slug?"on":""}" onclick="wizStore_('${esc(s.slug)}')">${esc(s.store_name)}</button>`).join("")+`</div>`;
    }
    q2+=`</div>`;
  }
  let q3="";
  if(w.step>=3){
    q3=`<div class="wq"><div class="wqt">Q3. 何を見ますか？（選ぶとすぐ表示されます）</div><div class="wopts">`+
      `<button class="wbtn" onclick="wizDept_('ALL')">Σ 合計（全部門）</button>`+
      S.meta.depts.map(d=>`<button class="wbtn" onclick="wizDept_('${esc(d.name)}')">${esc(d.name)}</button>`).join("")+
      `</div></div>`;
  }
  $("app").innerHTML=
    demoBanner_()+
    `<div style="max-width:780px;margin:3vh auto 0">`+
    `<h2 class="title" style="text-align:center">部門損益 可視化</h2>`+
    `<p class="subtitle" style="text-align:center">見たい範囲を選ぶと分析画面が開きます。モードや対象はあとから自由に変更できます。</p>`+
    `<div class="wcard">${q1}${q2}${q3}</div></div>`;
}
function wizKind_(k){ S.wiz.kind=k; S.wiz.step=2; S.wiz.area=null; S.wiz.store=null; renderWizard_(); }
function wizArea_(a){ S.wiz.area=a; S.wiz.store=null; if(S.wiz.kind==="AREA") S.wiz.step=3; renderWizard_(); }
function wizStore_(s){ S.wiz.store=s; S.wiz.step=3; renderWizard_(); }
function wizDept_(d){
  S.area=S.wiz.area; S.scope=(S.wiz.kind==="AREA")?"AREA":S.wiz.store; S.dept=d;

function reopenWizard_(){ S.wiz={ step:1, kind:null, area:null, store:null }; renderWizard_(); }

/* ── 共通セレクト部品 ── */
function areaSelect_(id,fn,val){ return `<select id="${id}" onchange="${fn}(this.value)">`+S.meta.areas.map(a=>`<option value="${esc(a.name)}" ${a.name===val?"selected":""}>${esc(a.name)}</option>`).join("")+`</select>`; }
function storeSelect_(id,fn,area,val){ return `<select id="${id}" onchange="${fn}(this.value)">`+storesOfArea_(area).map(s=>`<option value="${esc(s.slug)}" ${s.slug===val?"selected":""}>${esc(s.store_name)}</option>`).join("")+`</select>`; }
function deptSelect_(id,fn,val,withAll){ return `<select id="${id}" onchange="${fn}(this.value)">`+(withAll?`<option value="ALL" ${val==="ALL"?"selected":""}>合計（全部門）</option>`:"")+S.meta.depts.map(d=>`<option value="${esc(d.name)}" ${d.name===val?"selected":""}>${esc(d.name)}</option>`).join("")+`</select>`; }

/* ── 分析画面（3モード: 総合分析 ／ 比較・内訳 ／ 予算対比） ── */
function modeDesc_(){
  return S.mode==="総合"?"1つの対象を5つの指標で深掘り（総合分析）"
       : S.mode==="比較"?"複数の対象を1つの指標で横比較（比較・内訳）"
       : "実績と予算の対比（予算対比）";
}
function compFilters_(){
  const c=S.comp;
  const kindSel=`<select id="cKind" onchange="onCompKind(this.value)">`+
    [["AREAS","エリア合計で比較"],["STORE_DEPTS","1店舗の部門内訳を比較"],["STORES","エリア内の店舗で比較"]]
    .map(o=>`<option value="${o[0]}" ${c.kind===o[0]?"selected":""}>${o[1]}</option>`).join("")+`</select>`;
  let sub="";
  if(c.kind==="AREAS") sub=`<span class="lb">部門</span>`+deptSelect_("cDept","onCompDept",c.dept,true);
  else if(c.kind==="STORE_DEPTS") sub=`<span class="lb">エリア</span>`+areaSelect_("cArea","onCompArea",c.area)+`<span class="lb">店舗</span>`+storeSelect_("cStore","onCompStore",c.area,c.store);
  else sub=`<span class="lb">エリア</span>`+areaSelect_("cArea","onCompArea",c.area)+`<span class="lb">部門</span>`+deptSelect_("cDept","onCompDept",c.dept,true);
  const chSel=`<select id="cChart" onchange="onCompChart(this.value)">`+compChartOptions_().map(o=>`<option value="${o[0]}" ${c.chart===o[0]?"selected":""}>${o[1]}</option>`).join("")+`</select>`;
  return `<span class="lb">比較</span>${kindSel}${sub}<span class="lb">チャート</span>${chSel}`;
}
function renderDash_(){
  S.view="dash";
  if(!S.comp.area) S.comp.area=S.area||(S.meta.areas[0]||{}).name||"";
  const modeSeg=`<span class="modeseg">`+[["総合","総合分析"],["比較","比較・内訳"],["予算","予算対比"]].map(m=>`<button class="${S.mode===m[0]?'on':''}" onclick="onMode('${m[0]}')">${m[1]}</button>`).join("")+`</span>`;
  const subSeg=(S.mode!=="予算")?`<span class="modeseg">`+["通常","前年対比"].map(m=>`<button class="${S.sub===m?'on':''}" onclick="onSub('${m}')">${m}</button>`).join("")+`</span>`:"";
  const mlist=(S.meta.months||[]);
  const baseSel=mlist.length?`<span class="lb">基準月</span><select id="fBase" onchange="onBaseYm(this.value)" title="表示範囲の末尾となる月（過去の12/24ヶ月窓を確認できます）"><option value="">最新（${fmtYm_(mlist[mlist.length-1])}）</option>`+
    mlist.slice().reverse().map(m=>`<option value="${m}" ${S.baseYm===m?"selected":""}>${fmtYm_(m)}</option>`).join("")+`</select>`:"";
  let filters="";
  if(S.mode==="比較") filters=compFilters_();
  else filters=`<span class="lb">エリア</span>`+areaSelect_("fArea","onArea",S.area)+
    `<span class="lb">店舗</span><select id="fScope" onchange="onScope(this.value)"><option value="AREA" ${S.scope==="AREA"?"selected":""}>エリア合計</option>`+
    storesOfArea_(S.area).map(s=>`<option value="${esc(s.slug)}" ${s.slug===S.scope?"selected":""}>${esc(s.store_name)}</option>`).join("")+`</select>`+
    `<span class="lb">部門</span>`+deptSelect_("fDept","onDept",S.dept,true);
  $("app").innerHTML=
    demoBanner_()+
    `<div style="margin-bottom:4px"><h2 class="title">部門損益 可視化</h2><p class="subtitle">${modeDesc_()}</p></div>`+
    `<div class="selbar">${modeSeg}${subSeg}${baseSel}<span style="border-left:1px solid var(--border);height:22px"></span>${filters}`+
    `<button class="btn" style="margin-left:auto" onclick="reopenWizard_()" title="ウィザードで選び直す">🧭 最初から選び直す</button>`+
    (S.isAdmin?`<button class="admin-btn" onclick="renderDataManage_()" title="Excelの取込（管理者向け）">⚙️ データ管理</button>`:``)+
    `</div>`+
    `<div id="scopechips" class="scopechips"></div>`+
    `<div id="chartwrap"><div class="note">読み込み中…</div></div>`;
  runMode_();
}
function onMode(v){ S.mode=v; if(v==="予算") S.sub="通常"; renderDash_(); }
function onSub(v){ S.sub=v; renderDash_(); }
function onBaseYm(v){ S.baseYm=v; renderDash_(); }
function onArea(v){ S.area=v; const sts=storesOfArea_(v); if(S.scope!=="AREA"&&!sts.some(s=>s.slug===S.scope)) S.scope="AREA"; renderDash_(); }
function onScope(v){ S.scope=v; renderDash_(); }
function onDept(v){ S.dept=v; renderDash_(); }
function onCompKind(v){ S.comp.kind=v; renderDash_(); }
function onCompArea(v){ S.comp.area=v; S.comp.store=""; renderDash_(); }
function onCompStore(v){ S.comp.store=v; renderDash_(); }
function onCompDept(v){ S.comp.dept=v; renderDash_(); }
function onCompChart(v){ S.comp.chart=v; renderDash_(); }
async function runMode_(){
  if(S.mode==="総合") await runDeep_();
  else if(S.mode==="比較") await runComp_();
  else await runBudget_();
}

/* ── スコープチップ ── */
function scopeLabel_(){
  const st=(S.scope==="AREA")?"エリア合計":((storesOfArea_(S.area).find(s=>s.slug===S.scope)||{}).store_name||S.scope);
  return { area:S.area, store:st, dept:(S.dept==="ALL"?"合計（全部門）":S.dept) };
}
function renderScopeChips_(){
  const c=$("scopechips"); if(!c) return;
  let chips="";
  if(S.mode==="比較"){
    const k=S.comp.kind, l=[];

    else if(k==="STORE_DEPTS"){ const st=storesOfArea_(S.comp.area).find(s=>s.slug===S.comp.store); l.push(["a",S.comp.area],["s",(st||{}).store_name||""],["d","部門内訳"]); }
    else { l.push(["a",S.comp.area+"（店舗比較）"],["d",S.comp.dept==="ALL"?"合計（全部門）":S.comp.dept]); }

/* ── v1 チャート（自前SVG: 売上・粗利=棒／粗利率=折線／前年ゴースト） ── */
function fmtK(v){ return Math.round(v).toLocaleString(); }
function niceMax(v){ if(v<=0)return 1; const e=Math.pow(10,Math.floor(Math.log10(v))); const f=v/e; const n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10; return n*e; }
function prevYm_(ym){ return (parseInt(ym.slice(0,4),10)-1)+ym.slice(4); }
function fmtYm_(ym){ return ym.slice(0,4)+"/"+ym.slice(4); }
/* 基準月フィルタ: S.baseYm 以下の月に絞る（表示窓・累計の末尾を基準月にする） */
function baseAll_(all){ return S.baseYm ? all.filter(r=>r.ym<=S.baseYm) : all; }
function windowRows_(all, yoy){
  const byYm={}; all.forEach(r=>byYm[r.ym]=r);   // 前年参照は基準月フィルタ前の全月から引く
  const base=baseAll_(all);
  // 通常＝基準月から24ヶ月／前年対比＝前年同月データがある月だけを基準月から最大12ヶ月（＝同月対比）
  const disp = yoy ? base.filter(r=>byYm[prevYm_(r.ym)]).slice(-12)
                   : base.slice(-Math.min(S.meta.display_months||24, base.length));
  return disp.map(r=>({ ...r, prev: byYm[prevYm_(r.ym)]||null }));
}
function card_(title,sub,svg){ return `<div class="chartcard"><div class="chead"><b>${title}</b><span class="lb">${sub}</span></div>${svg}</div>`; }

/* ── 総合分析（Deep Dive: 1対象×5指標の縦積み） ── */
async function runDeep_(){
  const w=$("chartwrap"); if(w) w.innerHTML=`<div class="note">読み込み中…</div>`;
  const fname=`series/${aslug_(S.area)}__${dslug_(S.dept)}__${S.scope}.json`;
  try{ S.series = await loadJson(fname); }
  catch(e){ if(w) w.innerHTML=`<div class="note">この範囲のデータがありません（${esc(fname)}）。</div>`; return; }
  renderDeepCharts_();
}
function renderDeepCharts_(){
  const w=$("chartwrap"); if(!w||!S.series) return;
  renderScopeChips_();
  const allRaw=S.series.months||[];
  const all=baseAll_(allRaw);   // 累計(YTD)も基準月時点で締める
  if(!all.length){ w.innerHTML=`<div class="note">この基準月以前のデータがありません。</div>`; return; }
  const yoy=(S.sub==="前年対比");
  const rows=windowRows_(allRaw,yoy);
  if(yoy && !rows.length){ w.innerHTML=`<div class="note">前年対比に必要な前年同月データがありません。</div>`; return; }
  const dispN=rows.length;
  const isDept=(S.dept!=="ALL");
  const sub=(t)=>`${t}${yoy?"／前年=灰・改善は濃く/悪化は淡く":""}`;
  // 累計(YTD)は原本と同じく「各チャートの右横に置く細い棒チャート」（前年対比のときだけ）
  const ytd=(series,title,rates)=>yoy?ytdBars_(all,series,title,rates):"";
  let html=
    card_("① 売上・粗利・粗利率", `直近${dispN}ヶ月・金額=千円${yoy?"／右軸=粗利率改善pt（緑=改善・赤=悪化）":""}`,
      withYtd_(svgSalesMargin_(rows,yoy), ytd([{key:"sales",name:"売上",fill:"#1f77b4"},{key:"gross_profit",name:"粗利",fill:"#ff7f0e"}],"累計（年度）",YTD_RATES["①"])))+
    card_("② ロス管理（廃棄・値引）", yoy?sub("廃棄・値引を前年と対比（減っていれば改善）"):`積み上げ棒＝金額／折線＝率（右軸）`,
      withYtd_(svgLoss_(rows,yoy), ytd([{key:"waste_amount",name:"廃棄",fill:"#d62728",lowerBetter:true},{key:"discount_amount",name:"値引",fill:"#C71585",lowerBetter:true}],"累計（年度）",YTD_RATES["②"])));
  if(yoy){
    svgCostYoY6_(rows).forEach(c=>{ html+=card_(c.title, sub("費用は減っていれば改善"),
      withYtd_(c.svg, ytdBars_(all,[{key:c.key,name:c.label,fill:c.color,lowerBetter:true}],"累計（年度）"))); });
  } else html+=card_("③ 経費構造推移（販管費内訳）", `積み上げ棒・金額=千円`, svgCostBreakdown_(rows));
  // ④は原本準拠で2枚: ④-1 営業利益（常時）／④-2 部門貢献利益（部門を選んでいるときだけ追加）
  html+=card_("④-1 営業利益", sub(S.dept==="ALL"?"営業利益（黒字=橙・赤字=青）":"この部門の営業利益"),
    withYtd_(svgProfit_(rows,"ALL",yoy), ytd([{key:"operating_profit",name:"営業利益",fill:"#ff7f0e"}],"累計（年度）")));
  if(isDept){
    html+=card_("④-2 部門貢献利益", sub("配賦前（青） vs 配賦後（水色）"),
      withYtd_(svgProfit_(rows,S.dept,yoy), ytd([{key:"cont_profit_pre",name:"配賦前",fill:"#1f77b4"},{key:"cont_profit_post",name:"配賦後",fill:"#17becf"}],"累計（年度）")));
  }
  html+=card_("⑤ 労働生産性", sub("人時売上（青）・人時生産性（緑）・円/人時"),
    withYtd_(svgProductivity_(rows,yoy), ytd([{key:"sales_per_man_hour",name:"人時売上",fill:"#1f77b4"},{key:"productivity_per_man_hour",name:"人時生産性",fill:"#2ca02c"}],"累計（年度）")));
  w.innerHTML=html;
}

/* ── 比較・内訳（Comparison: 複数対象×1指標の縦並び） ── */
const SGA_DEF={ "③-0":["sga_total","販管費計","#8c564b"], "③-1":["sga_personnel","人件費","#1f77b4"], "③-2":["sga_selling","販売費","#ff7f0e"], "③-3":["sga_admin_a","管理費A","#bcbd22"], "③-4":["sga_admin_b","管理費B","#2ca02c"], "③-5":["sga_depreciation","減価償却費","#9467bd"] };
function compChartOptions_(){
  const yoy=(S.sub==="前年対比");
  const o=[["①","① 売上・粗利・粗利率"],["②","② ロス管理"]];
  if(!yoy) o.push(["③","③ 販管費内訳（全体）"]);   // 原本準拠: 前年対比では全体積み上げは非表示（個別のみ）
  o.push(["③-0","③-0 販管費計"],["③-1","③-1 人件費"],["③-2","③-2 販売費"],["③-3","③-3 管理費A"],["③-4","③-4 管理費B"],["③-5","③-5 減価償却費"],["④-1","④-1 営業利益"]);
  // ④-2 部門貢献利益は「部門を見ているとき」だけ（原本 app.py: is_dept_mode）
  const deptMode=(S.comp.kind==="STORE_DEPTS")||(S.comp.dept&&S.comp.dept!=="ALL");
  if(deptMode) o.push(["④-2","④-2 部門貢献利益"]);
  o.push(["⑤","⑤ 労働生産性"]);
  return o;
}
function compChartLabel_(){ const x=compChartOptions_().find(a=>a[0]===S.comp.chart); return x?x[1]:S.comp.chart; }
function chartFor_(key,rows,yoy,dept){
  if(key==="①") return svgSalesMargin_(rows,yoy);
  if(key==="②") return svgLoss_(rows,yoy);
  if(key==="③") return svgCostBreakdown_(rows);
  if(SGA_DEF[key]){ const d=SGA_DEF[key]; return svgCostSingle_(rows,d[0],d[1],d[2],yoy); }
  if(key==="④-1") return svgProfit_(rows,"ALL",yoy);                      // 営業利益
  if(key==="④-2") return svgProfit_(rows,(dept&&dept!=="ALL")?dept:"D",yoy); // 部門貢献利益（配賦前/後）
  if(key==="④")   return svgProfit_(rows,dept,yoy);                       // 旧キーの保険
  return svgProductivity_(rows,yoy);
}
/* 累計チャートの率pt定義（原本 chart_sales_margin_ytd / chart_loss_ytd 準拠・PO指摘 2026-07-29）:
   ①=粗利率改善pt ／ ②=廃棄率・値引率・ロス率計の改善pt（縁=当該指標色・塗り=緑改善/赤悪化） */
const YTD_RATES={
  "①":[{name:"粗利率",edge:"#d62728",num:"gross_profit",den:"sales"}],
  "②":[{name:"廃棄率",edge:"#d62728",num:"waste_amount",den:"sales",lowerBetter:true},
       {name:"値引率",edge:"#C71585",num:"discount_amount",den:"sales",lowerBetter:true},
       {name:"ロス率計",edge:"#FFAB00",num:["waste_amount","discount_amount"],den:"sales",lowerBetter:true}]
};
function ytdRatesFor_(key){ return YTD_RATES[key]||null; }
/* 比較・内訳の前年対比: チャート種別→累計(YTD)系列の対応（総合分析と同じマッピング・PO指摘 2026-07-29） */
function ytdSeriesFor_(key){
  if(key==="①") return [{key:"sales",name:"売上",fill:"#1f77b4"},{key:"gross_profit",name:"粗利",fill:"#ff7f0e"}];
  if(key==="②") return [{key:"waste_amount",name:"廃棄",fill:"#d62728",lowerBetter:true},{key:"discount_amount",name:"値引",fill:"#C71585",lowerBetter:true}];
  if(SGA_DEF[key]){ const d=SGA_DEF[key]; return [{key:d[0],name:d[1],fill:d[2],lowerBetter:true}]; }
  if(key==="④-1") return [{key:"operating_profit",name:"営業利益",fill:"#ff7f0e"}];
  if(key==="④-2"||key==="④") return [{key:"cont_profit_pre",name:"配賦前",fill:"#1f77b4"},{key:"cont_profit_post",name:"配賦後",fill:"#17becf"}];
  return [{key:"sales_per_man_hour",name:"人時売上",fill:"#1f77b4"},{key:"productivity_per_man_hour",name:"人時生産性",fill:"#2ca02c"}];
}
async function runComp_(){
  const w=$("chartwrap"); if(!w) return;
  const c=S.comp;
  if(!compChartOptions_().some(o=>o[0]===c.chart)) c.chart="①";   // 前年対比で③全体が消えた時の受け皿
  let targets=[];
  if(c.kind==="AREAS"){
    targets=S.meta.areas.map(a=>({label:`${a.name}（エリア合計）`, file:`series/${a.slug}__${c.dept==="ALL"?"ALL":dslug_(c.dept)}__AREA.json`, dept:c.dept}));
  } else if(c.kind==="STORE_DEPTS"){
    const sts=storesOfArea_(c.area); const st=sts.find(s=>s.slug===c.store)||sts[0];
    if(!st){ w.innerHTML=`<div class="note">このエリアに店舗がありません。</div>`; return; }
    c.store=st.slug;
    targets=[{label:`${st.store_name}｜合計（全部門）`, file:`series/${aslug_(c.area)}__ALL__${st.slug}.json`, dept:"ALL"}]
      .concat(S.meta.depts.map(d=>({label:`${st.store_name}｜${d.name}`, file:`series/${aslug_(c.area)}__${d.slug}__${st.slug}.json`, dept:d.name})));
  } else {
    targets=[{label:`${c.area}（エリア合計）`, file:`series/${aslug_(c.area)}__${c.dept==="ALL"?"ALL":dslug_(c.dept)}__AREA.json`, dept:c.dept}]
      .concat(storesOfArea_(c.area).map(s=>({label:s.store_name, file:`series/${aslug_(c.area)}__${c.dept==="ALL"?"ALL":dslug_(c.dept)}__${s.slug}.json`, dept:c.dept})));
  }
  w.innerHTML=`<div class="note">読み込み中…（${targets.length}件）</div>`;
  const yoy=(S.sub==="前年対比");
  const results=await Promise.all(targets.map(async t=>{ try{ return {t, s:await loadJson(t.file)}; }catch(e){ return {t, s:null}; } }));
  const cards=[];
  for(const x of results){
    if(!x.s||!(x.s.months||[]).length) continue;          // 欠測範囲は表示しない（行欠落=可視化なし）
    const rows=windowRows_(x.s.months,yoy);
    if(!rows.length) continue;
    // 前年対比は総合分析と同じく右横に累計(YTD)を併記（基準月時点で締める）
    const ytdSvg=yoy?ytdBars_(baseAll_(x.s.months||[]), ytdSeriesFor_(c.chart), "累計（年度）", ytdRatesFor_(c.chart)):"";
    cards.push(card_(esc(x.t.label), `${esc(compChartLabel_())}・${yoy?"前年対比"+rows.length+"ヶ月":"直近"+rows.length+"ヶ月"}`, withYtd_(chartFor_(c.chart,rows,yoy,x.t.dept), ytdSvg)));
  }
  renderScopeChips_();
  w.innerHTML = cards.length?cards.join(""):`<div class="note">この条件で表示できるデータがありません。</div>`;
}

/* ── 予算対比（Budget vs Actual: 12ヶ月窓。予算未取込なら案内） ── */
async function runBudget_(){
  const w=$("chartwrap"); if(w) w.innerHTML=`<div class="note">読み込み中…</div>`;
  const fname=`series/${aslug_(S.area)}__${dslug_(S.dept)}__${S.scope}.json`;
  try{ S.series = await loadJson(fname); }
  catch(e){ if(w) w.innerHTML=`<div class="note">この範囲のデータがありません（${esc(fname)}）。</div>`; return; }
  renderScopeChips_();
  const all=baseAll_(S.series.months||[]);   // 基準月まで（累計も基準月時点で締める）
  const hasBudget=all.some(r=>(r.budget_sales||0)>0||(r.budget_gross_profit||0)>0);
  if(!hasBudget){
    w.innerHTML=`<div class="chartcard" style="max-width:720px"><div class="chead"><b>予算対比</b></div>`+

      `実績vs予算（灰=予算・達成=濃・未達=淡）と粗利率差pt（緑=改善・赤=悪化）をここに表示します。</div></div>`;

}
/* 率プロットの当たり判定拡大: 小さな可視点の上に透明ヒット円(title持ち)を重ねる（PO指摘 2026-07-29: 率のツールチップが実用上出ない） */
function ptHit_(cx,cy,tip,r){ return `<circle cx="${cx}" cy="${cy}" r="${r||9}" fill="transparent" pointer-events="all"><title>${tip}</title></circle>`; }
/* 横軸の年月ラベル: 月は毎月表示・年（YY/）は先頭と1月のみ付す（PO要望 2026-07-29） */
function xMonthTicks_(rows, cx, y1){
  let g="";
  rows.forEach((r,i)=>{ const c=cx(i), mm=r.ym.slice(4), lab=(i===0||mm==="01")?`${r.ym.slice(2,4)}/${mm}`:mm;
    g+=`<text x="${c.toFixed(1)}" y="${(y1+13).toFixed(1)}" text-anchor="end" font-size="9" fill="#64748b" transform="rotate(-60 ${c.toFixed(1)} ${(y1+13).toFixed(1)})">${lab}</text>`; });
  return g;
}
function chartBase_(rows, o){
  const W=1000,H=430,mL=68,mR=(o.maxRight!=null?62:24),mT=10,mB=58;
  const x0=mL,x1=W-mR,y0=mT,y1=H-mB,pw=x1-x0,ph=y1-y0,n=rows.length,bw=pw/n;
  // minLeft を渡すと符号付き軸（0線あり）。未指定＝従来どおり 0 起点
  const maxL=niceMax(o.maxLeft||1), minL=(o.minLeft<0)?-niceMax(-o.minLeft):0;
  const maxR=(o.maxRight!=null)?niceMax(o.maxRight||0.1):null;
  const yL=v=>y1-((v-minL)/(maxL-minL))*ph, yR=v=>maxR?y1-(v/maxR)*ph:0, cx=i=>x0+bw*(i+0.5);
  let g=""; const T=4;
  for(let t=0;t<=T;t++){ const val=minL+(maxL-minL)*t/T, y=yL(val);
    g+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="${(minL<0&&Math.abs(val)<1e-9)?'#cbd5e1':'#eef2f7'}"/>`;
    g+=`<text x="${x0-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#94a3b8">${fmtK(val)}</text>`;
    if(maxR!=null) g+=`<text x="${x1+6}" y="${(yR(maxR*t/T)+3).toFixed(1)}" text-anchor="start" font-size="10" fill="#94a3b8">${o.rightPct?(maxR*t/T*100).toFixed(1)+"%":fmtK(maxR*t/T)}</text>`;
  }
  const midY=(y0+ph/2).toFixed(1);
  g+=`<text x="16" y="${midY}" transform="rotate(-90 16 ${midY})" text-anchor="middle" font-size="11" fill="#64748b">${esc(o.leftTitle||"金額(千円)")}</text>`;
  if(o.rightTitle) g+=`<text x="${W-14}" y="${midY}" transform="rotate(90 ${W-14} ${midY})" text-anchor="middle" font-size="11" fill="#64748b">${esc(o.rightTitle)}</text>`;
  g+=xMonthTicks_(rows,cx,y1);
  g+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#cbd5e1"/>`;
  return {frame:g, yL, yR, cx, x0, x1, y1, yz:yL(0), bw, W, H, n};
}
function legendSvg_(items, x0, W){ let lx=x0,lg=""; items.forEach(a=>{ lg+=`<rect x="${lx}" y="0" width="11" height="11" rx="2" fill="${a[0]}"/><text x="${lx+15}" y="9.5" font-size="11" fill="#334155">${a[1]}</text>`; lx+=15+a[1].length*13+16; }); return `<svg viewBox="0 0 ${W} 14" style="width:100%;height:16px" role="img">${lg}</svg>`; }
function svgWrap_(b, body){ return `<svg viewBox="0 0 ${b.W} ${b.H}" style="width:100%;height:auto" role="img">${b.frame}${body}</svg>`; }

/* ── 前年対比の棒の描き方（オリジナル charts.py 準拠） ───────────────────────
   ・1ヶ月に2系列（①売上/粗利・②廃棄/値引・④配賦前/配賦後・⑤人時売上/生産性）
       → 系列を左右に振り分けて2本並べ、前年は「幅を狭めて同じ位置に重ねる」
         （原本: ghost size15〜20 opacity .3〜.5 ／ 当年 size30）
   ・1ヶ月に1系列（③各費目・④営業利益）
       → 前年を左に、当年を右に「少しずらす」（原本: xOffset -5 / +5・ghost size20 / 当年 size30）
   ・当年の濃さ = 改善なら不透明1.0／悪化なら淡く（原本 0.3〜0.4）                     */
const YOY_GHOST="#b6b6b6";
function yoyGeom_(bw, nSeries){
  if(nSeries>=2){
    // 2系列: 系列ごとに左右へ。前年は同位置で細く重ねる（原本の xOffset(label) 相当）
    const w=Math.max(3,bw*0.30), gw=Math.max(2,w*0.5), dx=bw*0.19;
    return { w, gw, off:i=>(i===0?-dx:dx), gOff:i=>(i===0?-dx:dx), gOpacity:0.5 };
  }
  // 1系列: 前年を左・当年を右へずらす（原本の -5/+5 相当）
  const w=Math.max(4,bw*0.34), gw=Math.max(3,bw*0.24), dx=bw*0.13;
  return { w, gw, off:()=>dx, gOff:()=>-dx, gOpacity:0.5 };
}
/** 前年対比の棒ペアを描く。vals=[{v,prev,fill,name}] （1〜2系列） */
function yoyBars_(b, i, vals){
  const G=yoyGeom_(b.bw, vals.length), c=b.cx(i);
  let g="";
  vals.forEach((s,si)=>{
    const yz=b.yz!=null?b.yz:b.y1;
    const bar=(x,w,v,fill,op,tip)=>{ const yv=b.yL(v), top=Math.min(yv,yz), h=Math.max(0.5,Math.abs(yz-yv));
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" opacity="${op}"><title>${tip}</title></rect>`; };
    if(s.prev!=null) g+=bar(c+G.gOff(si)-G.gw/2, G.gw, s.prev, YOY_GHOST, G.gOpacity, `前年 ${s.name} ${fmtK(s.prev)}`);
    const improved = s.prev==null ? true : (s.lowerBetter ? (s.v<s.prev) : (s.v>=s.prev));
    const d=s.prev!=null?s.v-s.prev:null;
    const yoyTxt=s.prev!=null?`（前年 ${fmtK(s.prev)}・差 ${(d>=0?"+":"−")+fmtK(Math.abs(d))}${s.prev!==0?`・前年比 ${(s.v/s.prev*100).toFixed(1)}%`:""}・${improved?"改善":"悪化"}）`:"";
    g+=bar(c+G.off(si)-G.w/2, G.w, s.v, s.fill, (improved?1:0.35),
      `${s.ym||""} ${s.name} ${fmtK(s.v)}${yoyTxt}`);
  });
  return g;
}
/* ── 累計（年度）: 各チャートの右横に置く細い「棒」チャート（原本は columns([5,1]) の側チャート） ──
   系列ごとに 前年=灰の細棒＋当年=色棒 を並べる。線グラフではない。 */
function ytdBars_(all, series, title, rates){
  if(!all.length) return "";
  const last=all[all.length-1].ym, y=+last.slice(0,4), m=+last.slice(4), fy=(m>=4?y:y-1);
  const cur=all.filter(r=>r.ym>=`${fy}04` && r.ym<=last);
  const prev=all.filter(r=>r.ym>=`${fy-1}04` && r.ym<=`${y-1}${last.slice(4)}`);
  if(!cur.length) return `<div class="note">当年度の累計データがありません。</div>`;
  const sum=(arr,k)=>Array.isArray(k)?k.reduce((s,kk)=>s+arr.reduce((a,r)=>a+(r[kk]||0),0),0):arr.reduce((s,r)=>s+(r[k]||0),0);
  const items=series.map(s=>({ name:s.name, fill:s.fill, lowerBetter:!!s.lowerBetter,
    v:sum(cur,s.key), prev:prev.length?sum(prev,s.key):null }));
  let mx=0,mn=0; items.forEach(it=>{ mx=Math.max(mx,it.v,it.prev||0); mn=Math.min(mn,it.v,it.prev||0); });
  const hasRates=!!(rates&&rates.length&&prev.length);
  const W=260,H=430,mL=52,mR=hasRates?34:8,mT=10,mB=58,x0=mL,x1=W-mR,y0=mT,y1=H-mB,ph=y1-y0,pw=x1-x0;
  const MX=mx>0?niceMax(mx):1, MN=mn<0?-niceMax(-mn):0;
  const yL=v=>y1-((v-MN)/(MX-MN))*ph, yz=yL(0);
  let g=""; const T=4;
  for(let t=0;t<=T;t++){ const val=MN+(MX-MN)*t/T, yy=yL(val);
    g+=`<line x1="${x0}" y1="${yy.toFixed(1)}" x2="${x1}" y2="${yy.toFixed(1)}" stroke="${(MN<0&&Math.abs(val)<1e-9)?'#cbd5e1':'#eef2f7'}"/>`+
       `<text x="${x0-5}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#94a3b8">${fmtK(val)}</text>`; }
  const slot=pw/items.length;
  items.forEach((it,i)=>{
    const c=x0+slot*(i+0.5), w=Math.max(8,slot*0.34), gw=Math.max(5,slot*0.22), dx=slot*0.13;
    const bar=(x,bw2,v,fill,op,tip)=>{ const yv=yL(v), top=Math.min(yv,yz), h=Math.max(0.5,Math.abs(yz-yv));
      return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw2.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" opacity="${op}"><title>${tip}</title></rect>`; };
    if(it.prev!=null) g+=bar(c-dx-gw/2, gw, it.prev, YOY_GHOST, 0.5, `前年累計 ${it.name} ${fmtK(it.prev)}`);
    const improved = it.prev==null ? true : (it.lowerBetter ? (it.v<it.prev) : (it.v>=it.prev));
    const diff=it.prev!=null?it.v-it.prev:null;
    const yoyTxt=it.prev!=null?`（前年 ${fmtK(it.prev)}・差 ${(diff>=0?"+":"−")+fmtK(Math.abs(diff))}${it.prev!==0?`・前年比 ${(it.v/it.prev*100).toFixed(1)}%`:""}・${improved?"改善":"悪化"}）`:"";
    g+=bar(c+dx-w/2, w, it.v, it.fill, (improved?1:0.35), `当年累計 ${it.name} ${fmtK(it.v)}${yoyTxt}`);
    g+=`<text x="${c.toFixed(1)}" y="${(y1+14).toFixed(1)}" text-anchor="middle" font-size="9" fill="#64748b">${esc(it.name)}</text>`;
  });
  // 率の累計改善pt（原本 chart_*_ytd 準拠: 塗り=緑改善/赤悪化・縁=当該指標色・右軸=0中央の対称スケール・ゼロ破線）
  if(hasRates){
    const pts=rates.map(rt=>{
      const cd=sum(cur,rt.den), pd_=sum(prev,rt.den);
      if(!cd||!pd_) return null;
      const cr=sum(cur,rt.num)/cd, pr=sum(prev,rt.num)/pd_;
      const pt=(rt.lowerBetter?(pr-cr):(cr-pr))*100;
      return {name:rt.name, edge:rt.edge, pt, cr, pr};
    }).filter(Boolean);
    if(pts.length){
      let mxp=0; pts.forEach(p=>mxp=Math.max(mxp,Math.abs(p.pt))); mxp=Math.max(0.1,mxp*1.15);
      const yP=v=>y0+ph/2-(v/mxp)*(ph/2), zy=yP(0);
      g+=`<line x1="${x0}" y1="${zy.toFixed(1)}" x2="${x1}" y2="${zy.toFixed(1)}" stroke="#0f172a" stroke-dasharray="4 4" opacity="0.55"/>`;
      [mxp,0,-mxp].forEach(v=>{ g+=`<text x="${x1+3}" y="${(yP(v)+3).toFixed(1)}" font-size="8" fill="#94a3b8">${v===0?"0":(v>0?"+":"−")+Math.abs(v).toFixed(1)}</text>`; });
      pts.forEach((p,i)=>{
        const px=(x0+pw*(pts.length>1?(0.25+0.5*i/(pts.length-1)):0.5)).toFixed(1), py=yP(p.pt).toFixed(1);
        const tip=`累計${p.name} ${p.pt>=0?"改善":"悪化"} ${(p.pt>=0?"+":"")+p.pt.toFixed(2)}pt（当年 ${(p.cr*100).toFixed(2)}%・前年 ${(p.pr*100).toFixed(2)}%）`;
        g+=`<circle cx="${px}" cy="${py}" r="5" fill="${p.pt>=0?"#15803d":"#dc2626"}" stroke="${p.edge}" stroke-width="2"/>`+ptHit_(px,py,tip,16);
      });
    }
  }
  g+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#cbd5e1"/>`;
  const label=`${fy}年度 4月〜${last.slice(4)}月`;
  g+=`<text x="${((x0+x1)/2).toFixed(1)}" y="${(y1+30).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#94a3b8">${esc(label)}</text>`;
  // タイトルは本体の凡例行と同じ高さ(16px)の別svgに出し、チャートsvg同士の縦位置（0線・軸）を揃える
  return `<svg viewBox="0 0 ${W} 14" style="width:100%;height:16px" role="img"><text x="0" y="10" font-size="12" fill="#334155">${esc(title||"累計")}</text></svg>`+
         `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">${g}</svg>`;
}
/* ── 年度累計 予算対比: 灰=予算累計・実績=達成1.0/未達0.4（原本 chart_budget_vs_actual_ytd 準拠・2026-07-29 PO指摘の移植漏れ対応） ──
   実績・予算とも「当年度内で予算が入っている月」だけで合算し、月集合を揃えてミスリードを防ぐ */
function ytdBudgetBars_(all){
  if(!all.length) return "";
  const last=all[all.length-1].ym, y=+last.slice(0,4), m=+last.slice(4), fy=(m>=4?y:y-1);
  const cur=all.filter(r=>r.ym>=`${fy}04` && r.ym<=last && ((r.budget_sales||0)>0||(r.budget_gross_profit||0)>0));
  if(!cur.length) return "";
  const sum=k=>cur.reduce((s,r)=>s+(r[k]||0),0);
  const items=[
    {name:"売上", fill:"#1f77b4", v:sum("sales"),        bud:sum("budget_sales")},
    {name:"粗利", fill:"#ff7f0e", v:sum("gross_profit"), bud:sum("budget_gross_profit")}
  ];
  let mx=0; items.forEach(it=>{ mx=Math.max(mx,it.v,it.bud); });
  const W=260,H=430,mL=52,mR=34,mT=10,mB=58,x0=mL,x1=W-mR,y0=mT,y1=H-mB,ph=y1-y0,pw=x1-x0;
  const MX=mx>0?niceMax(mx):1, yL=v=>y1-(v/MX)*ph;
  let g=""; const T=4;
  for(let t=0;t<=T;t++){ const val=MX*t/T, yy=yL(val);
    g+=`<line x1="${x0}" y1="${yy.toFixed(1)}" x2="${x1}" y2="${yy.toFixed(1)}" stroke="#eef2f7"/>`+
       `<text x="${x0-5}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-size="9" fill="#94a3b8">${fmtK(val)}</text>`; }
  const slot=pw/items.length;
  items.forEach((it,i)=>{
    const c=x0+slot*(i+0.5), w=Math.max(8,slot*0.34), gw=Math.max(5,slot*0.22), dx=slot*0.13;
    const bar=(x,bw2,v,fill,op,tip)=>{ const yv=yL(v), h=Math.max(0.5,y1-yv);
      return `<rect x="${x.toFixed(1)}" y="${yv.toFixed(1)}" width="${bw2.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" opacity="${op}"><title>${tip}</title></rect>`; };
    if(it.bud>0) g+=bar(c-dx-gw/2, gw, it.bud, "#c0c0c0", 0.55, `予算累計 ${it.name} ${fmtK(it.bud)}`);
    const ok=(it.bud<=0)||it.v>=it.bud;
    const bdiff=it.v-it.bud;
    g+=bar(c+dx-w/2, w, it.v, it.fill, (ok?1:0.4), `実績累計 ${it.name} ${fmtK(it.v)}${it.bud>0?`（予算 ${fmtK(it.bud)}・差 ${(bdiff>=0?"+":"−")+fmtK(Math.abs(bdiff))}・達成率 ${(it.v/it.bud*100).toFixed(1)}%）`:""}`);
    g+=`<text x="${c.toFixed(1)}" y="${(y1+14).toFixed(1)}" text-anchor="middle" font-size="9" fill="#64748b">${esc(it.name)}</text>`;
  });
  // 累計粗利率差pt（実績累計粗利率 − 予算累計粗利率。塗り=緑/赤・縁=粗利率色・右軸=0中央の対称スケール）
  const as=sum("sales"), ag=sum("gross_profit"), bs=sum("budget_sales"), bg=sum("budget_gross_profit");
  if(as>0&&bs>0){
    const cr=ag/as, br=bg/bs, pt=(cr-br)*100;
    const mxp=Math.max(0.1,Math.abs(pt)*1.15);
    const yP=v=>y0+ph/2-(v/mxp)*(ph/2), zy=yP(0);
    g+=`<line x1="${x0}" y1="${zy.toFixed(1)}" x2="${x1}" y2="${zy.toFixed(1)}" stroke="#0f172a" stroke-dasharray="4 4" opacity="0.55"/>`;
    [mxp,0,-mxp].forEach(v=>{ g+=`<text x="${x1+3}" y="${(yP(v)+3).toFixed(1)}" font-size="8" fill="#94a3b8">${v===0?"0":(v>0?"+":"−")+Math.abs(v).toFixed(1)}</text>`; });
    const rpx=(x0+pw*0.5).toFixed(1), rpy=yP(pt).toFixed(1), rtip=`累計粗利率差 ${(pt>=0?"+":"")+pt.toFixed(2)}pt（実績 ${(cr*100).toFixed(2)}%・予算 ${(br*100).toFixed(2)}%）`;
    g+=`<circle cx="${rpx}" cy="${rpy}" r="5" fill="${pt>=0?"#15803d":"#dc2626"}" stroke="#d62728" stroke-width="2"/>`+ptHit_(rpx,rpy,rtip,16);
  }
  g+=`<line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" stroke="#cbd5e1"/>`;
  const label=`${fy}年度 ${+cur[0].ym.slice(4)}月〜${+cur[cur.length-1].ym.slice(4)}月`;

/* 符号付き軸の枠（実データは減価償却の戻し等で負値が入る。0線を基準に上下へ描く） */
function chartBaseSigned_(rows, vals, leftTitle){
  const W=1000,H=430,mL=68,mR=24,mT=10,mB=58,x0=mL,x1=W-mR,y0=mT,y1=H-mB,ph=y1-y0,n=rows.length,bw=(x1-x0)/n;

  mx=mx>0?niceMax(mx):1; mn=mn<0?-niceMax(-mn):0;
  const yL=v=>y1-((v-mn)/(mx-mn))*ph, cx=i=>x0+bw*(i+0.5), yz=yL(0);
  let g=""; const T=4;
  for(let t=0;t<=T;t++){ const val=mn+(mx-mn)*t/T,y=yL(val);
    g+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="${Math.abs(val)<1e-9?'#cbd5e1':'#eef2f7'}"/><text x="${x0-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#94a3b8">${fmtK(val)}</text>`; }
  g+=`<text x="16" y="${(y0+ph/2).toFixed(1)}" transform="rotate(-90 16 ${(y0+ph/2).toFixed(1)})" text-anchor="middle" font-size="11" fill="#64748b">${esc(leftTitle||"金額(千円)")}</text>`;
  g+=xMonthTicks_(rows,cx,y1);
  return {frame:g, yL, cx, x0, x1, y1, yz, bw, W, H, n};

/* YoY共通: 前年ゴースト＋当年（改善=不透明/悪化=淡）の棒。配置は yoyGeom_（原本 charts.py 準拠）に一本化。

function yoyPairBars_(b, rows, defs){
  let g="";
  rows.forEach((r,i)=>{
    g+=yoyBars_(b,i,defs.map(d=>({

}

      let top,h;
      if(v>0){ const yb=yL(accP), yt=yL(accP+v); top=yt; h=yb-yt; accP+=v; }
      else   { const yt=yL(accN), yb=yL(accN+v); top=yt; h=yb-yt; accN+=v; }
      g+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" fill="${cp[2]}" opacity="0.9"><title>${r.ym} ${cp[1]} ${fmtK(v)}</title></rect>`;
    });
  });
  g+=`<text x="16" y="${(y0+ph/2).toFixed(1)}" transform="rotate(-90 16 ${(y0+ph/2).toFixed(1)})" text-anchor="middle" font-size="11" fill="#64748b">金額(千円)</text>`;
  g+=xMonthTicks_(rows,cx,y1);
  return legendSvg_(comps.map(cp=>[cp[2],cp[1]]),x0,W)+`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">${g}</svg>`;
}
function svgProfit_(rows, dept, yoy){
  const deptLevel=(dept!=="ALL");
  const vals=[]; rows.forEach(r=>{ if(deptLevel){ vals.push(r.cont_profit_pre||0,r.cont_profit_post||0); } else vals.push(r.operating_profit||0);
    if(yoy&&r.prev){ if(deptLevel){ vals.push(r.prev.cont_profit_pre||0,r.prev.cont_profit_post||0); } else vals.push(r.prev.operating_profit||0); } });
  let mn=Math.min(0,...vals), mx=Math.max(0,...vals);
  mx=mx>0?niceMax(mx):1; mn=mn<0?-niceMax(-mn):0;
  const W=1000,H=430,mL=68,mR=24,mT=10,mB=58,x0=mL,x1=W-mR,y0=mT,y1=H-mB,ph=y1-y0,n=rows.length,bw=(x1-x0)/n;
  const yL=v=>y1-((v-mn)/(mx-mn))*ph, cx=i=>x0+bw*(i+0.5), yz=yL(0);
  let g=""; const T=4;
  for(let t=0;t<=T;t++){ const val=mn+(mx-mn)*t/T,y=yL(val); g+=`<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="${Math.abs(val)<1e-9?'#cbd5e1':'#eef2f7'}"/><text x="${x0-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="10" fill="#94a3b8">${fmtK(val)}</text>`; }
  const bar=(x,w,v,fill,tip)=>{ const yv=yL(v),top=Math.min(yv,yz),h=Math.max(0.5,Math.abs(yz-yv)); return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" opacity="0.9"><title>${tip}</title></rect>`; };
  const barOp=(x,w,v,fill,tip,op)=>{ const yv=yL(v),top=Math.min(yv,yz),h=Math.max(0.5,Math.abs(yz-yv)); return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" opacity="${op}"><title>${tip}</title></rect>`; };
  const B={yL, cx, y1, yz, bw, x0, x1, W, H, n};   // yoyPairBars_ に渡す枠情報（配置は共通部品に一本化）
  if(yoy){
    g+=deptLevel
      ? yoyPairBars_(B, rows, [
          {get:r=>r.cont_profit_pre,  label:"貢献利益 配賦前", color:"#1f77b4"},
          {get:r=>r.cont_profit_post, label:"貢献利益 配賦後", color:"#17becf"}])
      : yoyPairBars_(B, rows, [
          {get:r=>r.operating_profit, label:"営業利益", color:"#ff7f0e"}]);
  } else {
    rows.forEach((r,i)=>{ const c=cx(i);
      if(deptLevel){ const w=Math.max(3,bw*0.30), dx=bw*0.17;
        g+=bar(c-dx-w/2,w,(r.cont_profit_pre||0),"#1f77b4",`${r.ym} 貢献利益 配賦前 ${fmtK(r.cont_profit_pre||0)}`);
        g+=bar(c+dx-w/2,w,(r.cont_profit_post||0),"#17becf",`${r.ym} 貢献利益 配賦後 ${fmtK(r.cont_profit_post||0)}`);
      } else { const v=r.operating_profit||0, w=Math.max(4,bw*0.6);
        g+=bar(c-w/2,w,v,(v>=0?"#ff7f0e":"#1f77b4"),`${r.ym} 営業利益 ${fmtK(v)}`);
      }
    });
  }
  g+=`<text x="16" y="${(y0+ph/2).toFixed(1)}" transform="rotate(-90 16 ${(y0+ph/2).toFixed(1)})" text-anchor="middle" font-size="11" fill="#64748b">金額(千円)</text>`;
  g+=xMonthTicks_(rows,cx,y1);
  let leg=deptLevel?[["#1f77b4","貢献利益(配賦前)"],["#17becf","貢献利益(配賦後)"]]
                   :(yoy?[["#ff7f0e","営業利益"]]:[["#ff7f0e","営業利益(黒字)"],["#1f77b4","営業利益(赤字)"]]);
  if(yoy) leg=leg.concat([[YOY_GHOST,"前年"]]);
  return legendSvg_(leg,x0,W)+`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img">${g}</svg>`;
}
function svgProductivity_(rows, yoy){
  let mx=0,mn=0; rows.forEach(r=>{ mx=Math.max(mx,r.sales_per_man_hour||0,r.productivity_per_man_hour||0);
    mn=Math.min(mn,r.sales_per_man_hour||0,r.productivity_per_man_hour||0);   // 他共通等は生産性が負になり得る
    if(yoy&&r.prev){ mx=Math.max(mx,r.prev.sales_per_man_hour||0,r.prev.productivity_per_man_hour||0);
      mn=Math.min(mn,r.prev.sales_per_man_hour||0,r.prev.productivity_per_man_hour||0); } });
  const b=chartBase_(rows,{maxLeft:mx,minLeft:mn,leftTitle:"円/人時"});
  const zeroY=b.yL(0);
  let g;
  if(yoy){
    g=yoyPairBars_(b,rows,[
      {get:r=>r.sales_per_man_hour,        label:"人時売上",   color:"#1f77b4", lowerBetter:false},
      {get:r=>r.productivity_per_man_hour, label:"人時生産性", color:"#2ca02c", lowerBetter:false}
    ]);
    return legendSvg_([["#1f77b4","人時売上"],["#2ca02c","人時生産性"],["#cccccc","前年"]],b.x0,b.W)+svgWrap_(b,g);
  }
  g=""; const w=Math.max(4,b.bw*0.6);
  const bar=(x,v,fill,tip)=>{ const yv=b.yL(v), top=Math.min(yv,zeroY), h=Math.max(0.5,Math.abs(zeroY-yv));
    return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" opacity="0.85"><title>${tip}</title></rect>`; };
  rows.forEach((r,i)=>{ const x=b.cx(i)-w/2, s=r.sales_per_man_hour||0, p=r.productivity_per_man_hour||0;
    g+=bar(x,s,"#1f77b4",`${r.ym} 人時売上 ${fmtK(s)}`);

  });
  return legendSvg_([["#1f77b4","人時売上"],["#2ca02c","人時生産性"]],b.x0,b.W)+svgWrap_(b,g);
}

/* ── データ管理（管理者アップロード）── */
const _XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
function fileB64_(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=rej; r.readAsDataURL(file); }); }
function busyOverlay_(show,title,sub){ let o=$("busyOverlay"); if(!show){ if(o)o.remove(); return; } if(!o){ o=document.createElement("div"); o.id="busyOverlay"; document.body.appendChild(o); } o.innerHTML=`<div class="bcard"><span class="spin"></span><div class="bttl">${esc(title||"処理中です")}</div><div class="bsub">${esc(sub||"画面を閉じずにお待ちください")}</div></div>`; }
function renderDataManage_(){
  $("app").innerHTML=
    `<div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><h2 class="title">データ管理（管理者）</h2>`+
    `<button class="btn" style="margin-left:auto" onclick="backToViz_()">← 可視化へ戻る</button></div>`+
    `<div class="dmcard">`+
    `<p class="lb">部門別損益・効率表Excel と 年度予算Excel を取り込みます。アップロード＝本部側の取込（ETL→outbox）を経て可視化へ反映されます（即時ではありません）。</p>`+
    dmZone_("loss","① 損益実績Excel（部門別損益・効率表）","月次の実績。年度を差し替える時は、その年度の月ファイルを揃えてアップロードしてください。")+
    dmZone_("budget","② 年度予算Excel（例: 2025年度予算（北関東）.xlsx）","エリア別の年度予算。")+
    `<div style="margin-top:14px"><button class="btn primary" id="dmUpBtn" onclick="dmUpload_()">選択したファイルをアップロード</button> <span id="dmMsg" class="lb"></span></div>`+
    (IS_GAS?"":`<p class="lb" style="color:#b45309;margin-top:10px">※ ローカル開発ではアップロードは無効（本番=GAS接続時に有効）。UI確認用です。</p>`)+
    `</div>`;
  dmRenderQ_();
}
function dmZone_(type,title,hint){
  return `<div class="dmzone"><h4>${esc(title)}</h4><p class="hint">${esc(hint)}</p>`+
    `<input type="file" accept=".xlsx" multiple onchange="dmPick_('${type}',this)">`+
    `<div class="uplist" id="dmq_${type}"></div></div>`;
}
function dmPick_(type,input){
  [...input.files].forEach(f=>{ if(!S.upQ.some(x=>x.type===type&&x.name===f.name&&x.size===f.size)) S.upQ.push({type,file:f,name:f.name,size:f.size,done:false}); });
  input.value=""; dmRenderQ_();
}
function dmRenderQ_(){
  ["loss","budget"].forEach(type=>{
    const host=$("dmq_"+type); if(!host) return;
    const items=S.upQ.filter(x=>x.type===type);
    host.innerHTML=items.length?items.map((x,i)=>`<div class="uprow"><span class="st">${x.done?"✅":"📄"}</span><span>${esc(x.name)}</span><span class="x" onclick="dmDel_('${type}',${i})">✕</span></div>`).join(""):`<div class="uprow" style="color:#94a3b8">（未選択）</div>`;
  });
}
function dmDel_(type,i){ const items=S.upQ.filter(x=>x.type===type); const t=items[i]; S.upQ=S.upQ.filter(x=>x!==t); dmRenderQ_(); }
async function dmUpload_(){
  const items=S.upQ.filter(x=>!x.done);
  if(!items.length){ $("dmMsg").textContent="アップロードするファイルを選んでください"; return; }
  if(!IS_GAS){ $("dmMsg").textContent="ローカルではアップロードできません（本番でご利用ください）"; return; }
  const btn=$("dmUpBtn"); btn.disabled=true;
  busyOverlay_(true,"アップロード中です",`0 / ${items.length} 件`);
  let ok=0,ng=0;
  for(let i=0;i<items.length;i++){ const x=items[i];
    busyOverlay_(true,"アップロード中です",`${i+1} / ${items.length} 件目：${x.name}`);
    try{ await gsCall("uploadInbox", x.type, x.name, await fileB64_(x.file), _XLSX_MIME); x.done=true; ok++; }
    catch(e){ ng++; }
  }
  busyOverlay_(false); btn.disabled=false;
  $("dmMsg").textContent = `${ok} 件アップロード完了${ng?`／${ng} 件失敗`:""}。本部側の取込（ETL→outbox）後に反映されます。`;
  S.upQ=S.upQ.filter(x=>!x.done); dmRenderQ_();
}
function backToViz_(){ renderDash_(); }

/* ── ご利用ガイド（標準レイアウト: サイド目次＋メイン本文・双方向連動） ──
   本文と目次は GAS（Guide.gs）が唯一の原本。公開HTMLには本文を置かない（PO方針 2026-07-27）。
   認証済みユーザーだけが getGuide で受け取る。管理者節はサーバー側で出し分け（非管理者には届かない）。
   フロントは「入れ物」のみ: 目次クリック→本文スクロール／本文スクロール→目次ハイライト(scroll-spy)。 */
let _gSecs=[];      // 表示中ガイドの目次定義（GASから受領）
let _gForce=null;   // 目次クリックで指定された見出し（利用者が自分でスクロールするまで優先）
function guideNavHtml_(){
  let h="";
  _gSecs.forEach(s=>{
    h+=`<a href="#${s.id}" data-gid="${s.id}" onclick="return gJump_('${s.id}')">${esc(s.t)}</a>`;
    (s.subs||[]).forEach(x=>{ h+=`<a class="sub" href="#${x.id}" data-gid="${x.id}" onclick="return gJump_('${x.id}')">${esc(x.t)}</a>`; });
  });
  return h;
}
let _gAnim=null;
function gJump_(id){
  const el=document.getElementById(id), gb=document.querySelector("#guide .gbody");
  if(!el||!gb) return false;
  // コンテナ基準の相対位置を自前算出（scrollIntoView はモーダル内で効かない環境がある）
  const to=Math.max(0, gb.scrollTop+(el.getBoundingClientRect().top-gb.getBoundingClientRect().top)-12);
  _gForce=id;   // クリックした見出しを明示（利用者が自分でスクロールしたら解除＝openGuide のリスナー）
  // スムーススクロールも自前実装（CSS scroll-behavior / scrollTo(behavior) は環境により無効なため依存しない）
  if(_gAnim) cancelAnimationFrame(_gAnim);
  // 非表示タブ・バックグラウンドでは rAF が発火しない（アニメも見えない）→ 即時移動で確実に着地させる
  if(document.visibilityState==="hidden"){ gb.scrollTop=to; gSpy_(); return false; }
  const from=gb.scrollTop, d=to-from, t0=performance.now(), dur=280;
  const step=(t)=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);   // ease-out
    gb.scrollTop=from+d*e; gSpy_();
    if(p<1) _gAnim=requestAnimationFrame(step); else _gAnim=null; };
  _gAnim=requestAnimationFrame(step);
  // 保険: rAF が抑制された場合でも必ず目的地へ（ジャンプが無反応になる事故を防ぐ）
  setTimeout(()=>{ if(Math.abs(gb.scrollTop-to)>1){ if(_gAnim) cancelAnimationFrame(_gAnim); _gAnim=null; gb.scrollTop=to; gSpy_(); } }, dur+90);
  return false;
}
function gSpy_(){
  const body=document.querySelector("#guide .gbody"); if(!body) return;
  const ids=[]; _gSecs.forEach(s=>{ ids.push(s.id); (s.subs||[]).forEach(x=>ids.push(x.id)); });
  if(!ids.length) return;
  const r=body.getBoundingClientRect(), top=r.top+16;
  let cur=ids[0];
  if(_gForce && ids.indexOf(_gForce)>=0){
    cur=_gForce;                                     // クリック直後は指定見出しを表示（末尾で止まっても意図どおり光る）
  } else if(body.scrollTop+body.clientHeight>=body.scrollHeight-4){
    // 最下部: これ以上スクロールできず先頭に来られない見出しがあるため、見えている最後の見出しを現在地とする
    ids.forEach(id=>{ const el=document.getElementById(id); if(el && el.getBoundingClientRect().top<r.bottom) cur=id; });
  } else {
    ids.forEach(id=>{ const el=document.getElementById(id); if(el && el.getBoundingClientRect().top<=top) cur=id; });
  }
  document.querySelectorAll("#guide .gnav a").forEach(a=>a.classList.toggle("on", a.dataset.gid===cur));
}
/* ガイドの取得と描画。g=null: 未接続の案内 ／ "loading": 読込中 ／ {error}: 失敗 ／ {sections,html}: 本文 */
function renderGuide_(g){
  closeGuide();
  let inner;
  if(g==="loading"){
    inner=`<div class="note" style="padding:40px;text-align:center"><span class="spin"></span><br><br>ご利用ガイドを読み込んでいます…</div>`;
  } else if(!g){
    inner=`<div class="note" style="padding:28px 32px;line-height:2">ご利用ガイドは<b>本番接続後</b>に表示されます（会社アカウントでのログインが必要です）。<br>`+
          `いま表示中のデモは色・見せ方の確認用のため、ガイド本文は含まれていません。</div>`;
  } else if(g.error){
    inner=`<div class="err" style="margin:20px">ご利用ガイドを取得できませんでした：${esc(g.error)}<br>時間をおいて再度お試しください。</div>`;
  } else {
    _gSecs=g.sections||[];
    inner=`<div class="gwrap"><nav class="gnav">${guideNavHtml_()}</nav><div class="gbody">${g.html||""}</div></div>`;
  }
  const el=document.createElement("div");
  el.id="guide";
  el.innerHTML=`<div class="gcard">
    <div class="ghead"><h2>📖 ご利用ガイド</h2><span class="gsub">部門損益 可視化</span>
      <button class="btn gclose" onclick="closeGuide()">閉じる</button></div>
    ${inner}
  </div>`;
  el.addEventListener("click",e=>{ if(e.target===el) closeGuide(); });
  document.body.appendChild(el);
  const gb=el.querySelector(".gbody");
  if(gb){
    gb.addEventListener("scroll", gSpy_);
    // 利用者が自分でスクロール操作をしたら「クリック指定」を解除し、現在位置の追従に戻す
    const release=()=>{ _gForce=null; gSpy_(); };
    ["wheel","touchstart","keydown","mousedown"].forEach(ev=>gb.addEventListener(ev, release, {passive:true}));
    _gForce=null;
    gSpy_();
  }
}
async function openGuide(){
  if(S.guideData){ renderGuide_(S.guideData); return; }        // セッション内キャッシュ
  if(!GAS_READY){ renderGuide_(null); return; }                 // デモ/未接続: 案内のみ（本文は配布しない）
  renderGuide_("loading");
  try{ const g=await gsCall("getGuide"); S.guideData=g; renderGuide_(g); }
  catch(e){ renderGuide_({error:String(e&&e.message||e)}); }
}
function closeGuide(){ const g=$("guide"); if(g) g.remove(); }

/* ポータル等からの直リンク（?guide=1）: 起動処理の完了後にご利用ガイドを自動で開く */
function autoGuide_(){ if(/[?&]guide=1/.test(location.search)) openGuide(); }
async function boot(){
  if(IS_LOCAL){ S.isAdmin=true; await startApp_(); autoGuide_(); return; }   // ローカル: 認証なし・モック・管理者扱いでUI確認
  if(!GAS_READY){
    $("app").innerHTML=`<div class="card"><div class="cico">🛠️</div><h3>部門損益 可視化（GitHub＋GAS 版・準備中）</h3>`+
      `<p>画面（3つの分析モード＋入口ウィザード）は実装済みです。<br>バックエンド（soneki-gas）のデプロイ URL を設定すると、会社アカウントのログインと実データ表示が有効になります。</p>`+
      `<div class="roadmap"><b>現在の状態</b><ul>`+
      `<li>総合分析（通常24ヶ月／前年対比12ヶ月＋累計） ✅ 実装済</li><li>比較・内訳（3つの比べ方×10チャート） ✅ 実装済</li><li>予算対比 … 年度予算Excelの取込後に有効</li>`+
      `</ul></div>`+
      `<div style="margin-top:16px"><button class="btn primary" onclick="startDemo_()">▶ サンプルデータで表示を見る（デモ）</button>`+
      `<p class="lb" style="margin-top:6px">実データは本部取込後に表示されます。デモは色・見せ方の確認用です。</p></div></div>`;
    autoGuide_();                                  // 未接続でも ?guide=1 は案内を表示（本文は本番接続後）
    return;
  }
  if(restoreAccessToken_()){ try{ await afterAuth_(); autoGuide_(); return; }catch(e){} }
  try{ await requestAccessTokenOnce_({silent:true}); await afterAuth_(); autoGuide_(); }
  catch(e){ renderLogin_(); }
}
boot();
